<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>采集控制台 · human_capture</title>
<link rel="stylesheet" href="../ui.css">
<style>
/* 页面布局；token 与基础组件来自 ../ui.css */
* { margin:0; padding:0; }
body { min-height:100vh; overflow:auto; }
header {
  display:flex; align-items:center; gap:14px; padding:0 16px; height:var(--h-topbar);
  background:var(--bg-sidebar); border-bottom:1px solid var(--border-subtle); flex-wrap:nowrap; overflow:hidden;
}
.title { font-weight:600; font-size:13px; white-space:nowrap; }
.stat { color:var(--text-muted); white-space:nowrap; font-size:12px; }
.stat b { color:var(--text-secondary); font-variant-numeric:tabular-nums; font-weight:500; }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--danger); margin-right:5px; vertical-align:middle; }
.dot.on  { background:var(--success); }
.dot.warn{ background:var(--warning); }
main { padding:16px; max-width:1100px; margin:0 auto; }
section { background:var(--bg-panel); border:1px solid var(--border-subtle); border-radius:var(--r-panel); padding:14px 16px; margin-bottom:14px; }
h2 { font-size:11px; font-weight:600; letter-spacing:1px; text-transform:uppercase; margin-bottom:10px; color:var(--text-muted); }
button.rec  { background:transparent; color:var(--danger); border-color:rgba(212,106,98,.45); }
button.rec:hover:not(:disabled) { background:var(--danger-soft); border-color:var(--danger); }
button.big  { height:34px; font-size:13px; padding:0 22px; font-weight:600; }
table { width:100%; border-collapse:collapse; margin-top:6px; }
th, td { padding:6px 8px; text-align:left; border-bottom:1px solid var(--border-subtle); font-variant-numeric:tabular-nums; font-size:12px; }
th { color:var(--text-muted); font-weight:500; font-size:11px; }
tr:hover td { background:rgba(255,255,255,.025); }
.badge { display:inline-flex; align-items:center; gap:5px; height:18px; padding:0 7px; border-radius:3px;
  font-size:10px; font-weight:600; letter-spacing:.8px; color:var(--text-secondary); background:var(--bg-elevated); }
.badge::before { content:""; width:5px; height:5px; border-radius:50%; background:currentColor; }
.badge.recording    { background:var(--danger-soft); color:var(--danger); }
.badge.rec          { animation:pulse 1.2s ease-in-out infinite; }
.badge.extracting   { background:var(--warning-soft); color:var(--warning); }
.badge.ready        { background:var(--success-soft); color:var(--success); }
.badge.transferring { background:var(--accent-soft); color:var(--accent); }
.badge.transferred  { background:var(--bg-elevated); color:var(--text-secondary); }
.badge.failed       { background:var(--danger-soft); color:var(--danger); }
.badge.purged       { background:var(--bg-elevated); color:var(--text-muted); text-decoration:line-through; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.55} }
.current-rec {
  display:flex; align-items:center; gap:14px; padding:10px 14px; background:var(--danger-soft);
  border:1px solid rgba(212,106,98,.4); border-radius:var(--r-ctl); margin-bottom:12px;
}
.current-rec .elapsed { font:600 20px var(--font-mono); font-variant-numeric:tabular-nums; color:var(--danger); }
.current-rec .sid { color:var(--text-secondary); font-size:12px; }
.empty { color:var(--text-muted); padding:8px 0; }
.err { color:var(--danger); font-size:12px; margin-top:8px; }
a { color:var(--accent); }
.meta-actions { margin-top:8px; }
</style>
</head>
<body>

<header>
  <span class="title">采集控制台</span>
  <span class="stat"><span class="dot" id="rosDot"></span>ROS <b id="rosVal">--</b></span>
  <span class="stat"><span class="dot" id="srvDot"></span>服务 <b id="srvVal">--</b></span>
  <span class="stat">盘余 <b id="diskVal">--</b> GB</span>
  <span class="stat">会话 <b id="totalVal">0</b></span>
  <span class="stat">录制 <b id="recVal">未</b></span>
  <span class="stat"><a href="/" target="_blank">↗ 实时预览(8090)</a></span>
</header>

<main>
  <section>
    <h2>录制</h2>
    <div id="currentRecWrap"></div>
    <div>
      <button class="rec big" id="btnStart">● 开始录制</button>
      <button class="big" id="btnStop" disabled>■ 停止</button>
      <div class="err" id="recErr"></div>
    </div>
  </section>

  <section>
    <h2>会话</h2>
    <table>
      <thead><tr>
        <th>session_id</th><th>状态</th><th>时长</th><th>帧</th><th>大小</th>
        <th>已下载</th><th>请求下载</th><th>创建时间</th><th>操作</th>
      </tr></thead>
      <tbody id="sessBody">
        <tr><td colspan="9" class="empty">加载中…</td></tr>
      </tbody>
    </table>
    <div class="err" id="sessErr"></div>
  </section>
</main>

<script src="capture_lib.js"></script>
<script src="capture.js"></script>
</body>
</html>
