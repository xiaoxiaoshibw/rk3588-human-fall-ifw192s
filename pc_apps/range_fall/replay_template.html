<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@@TITLE@@</title>
<style>
  :root{
    --bg:#0a0d12; --panel:#121821; --panel2:#0f141c; --line:#26303d;
    --ink:#e8eef7; --muted:#93a1b5; --green:#35ff7a; --red:#ff4d5e;
    --amber:#ffb84d; --cyan:#57d9ff; --blue:#4b8dff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 700px at 20% -10%,#16202c 0%,var(--bg) 60%);
       color:var(--ink);font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .wrap{max-width:1560px;margin:0 auto;padding:22px 22px 60px}
  header h1{font-size:21px;margin:0 0 4px;letter-spacing:.3px}
  .sub{color:var(--muted);margin:0 0 10px;font-size:13px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .badge{border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;color:#a8c0d5}
  .badge.warn{color:#e4c27d}
  .verdict{margin:10px 0 14px;padding:10px 14px;border-radius:10px;border:1px solid #24303f;
           background:linear-gradient(180deg,#111923,#0e141c);font-size:14px}
  .verdict b{color:var(--green)}
  main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:1180px){main{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;
           padding:9px 13px;border-bottom:1px solid var(--line);font-size:13px;color:#c6d3e3}
  .panel-h .hint{color:var(--muted);font-size:12px}
  #cloud{display:block;width:100%;height:auto;background:#070a0f;cursor:grab;touch-action:none}
  #cloud.drag{cursor:grabbing}
  .camwrap{position:relative;background:#070a0f}
  #cam{display:block;width:100%;height:auto;min-height:220px}
  #camNote{position:absolute;left:0;right:0;bottom:0;padding:5px 10px;font-size:12px;
           color:#cfe0f0;background:linear-gradient(180deg,transparent,rgba(4,7,11,.85))}
  .alarm{margin:12px;padding:10px 13px;border-radius:10px;border:1px solid var(--line);
         background:#0f141c;font-size:14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .alarm b{font-size:15px}
  .alarm.idle b{color:var(--muted)}
  .alarm.hot{border-color:#5a1d25;background:linear-gradient(180deg,#2a1015,#180a0d)}
  .alarm.hot b{color:var(--red)}
  .alarm.warm{border-color:#4a3a1f;background:#1b160d}
  .alarm.warm b{color:var(--amber)}
  .alarm small{color:var(--muted);font-size:12px}
  .statebar{display:flex;gap:8px;align-items:center;padding:0 12px 8px;flex-wrap:wrap}
  .chip{padding:3px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:#0e141d}
  .chip b{font-weight:600}
  .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px;padding:0 12px 14px}
  .metric{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 9px}
  .metric span{display:block;font-size:11px;color:var(--muted)}
  .metric b{font-size:15px;font-variant-numeric:tabular-nums}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 8px}
  button{background:#16202c;color:var(--ink);border:1px solid var(--line);border-radius:9px;
         padding:7px 14px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--blue)}
  button.primary{background:#123a25;border-color:#1f5a37;color:#9df0bd}
  input[type=range]{flex:1;min-width:200px;accent-color:#35ff7a}
  #tlabel{font-variant-numeric:tabular-nums;color:var(--muted);min-width:170px;text-align:right}
  #chart{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);
         background:#0b1018;cursor:crosshair}
  .notesbox{margin-top:16px}
  .notesbox summary{color:var(--muted);font-size:13px}
  .notes{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
  .note{background:#10161f;border:1px solid var(--line);border-left:3px solid #3a4a5e;
        border-radius:10px;padding:10px 13px;font-size:13px;color:#c3d0df}
  .note b{color:#e9f1fa}
  .note.warn{border-left-color:#b8860b;background:#171307}
  footer{margin-top:18px;color:var(--muted);font-size:12px}
  footer pre{background:#0b1018;border:1px solid var(--line);border-radius:9px;padding:10px;
             overflow:auto;color:#cbd8e8}
  details{margin-top:10px}
  summary{cursor:pointer;color:#c6d3e3}
  code{background:#0b1018;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:#cfe0f0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>@@TITLE@@</h1>
    <p class="sub">@@SUBTITLE@@</p>
    <div class="badges">@@BADGES@@</div>
    <div class="verdict">@@VERDICT@@</div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-h">
        <span>① 点云（绿框 = 被跟踪的单个目标）</span>
        <span class="hint">拖动旋转 · 滚轮缩放 · 双击复位</span>
      </div>
      <canvas id="cloud" width="960" height="640"></canvas>
      <div class="panel-h" style="border-top:1px solid var(--line);border-bottom:none">
        <span class="hint">灰蓝点 = 场景实测点（按高度着色）· 绿点 = 目标实测点 · 绿线 = 目标三维包围盒 · 青点 = 传感器原点</span>
      </div>
    </section>

    <section class="panel">
      <div class="panel-h">
        <span>② 相机画面（接收时刻近邻预览）</span>
        <span class="hint" id="camMeta">—</span>
      </div>
      <div class="camwrap">
        <img id="cam" alt="相机画面" src="">
        <div id="camNote">—</div>
      </div>
      <div id="alarm" class="alarm idle"><b id="alarmTitle">无报警</b><span id="alarmText"></span></div>
      <div class="statebar">
        <span class="chip">跟踪 <b id="sTrack">—</b></span>
        <span class="chip">状态 <b id="sState">—</b></span>
        <span class="chip">基线 <b id="sBase">—</b></span>
      </div>
      <div class="metrics" id="metrics"></div>
    </section>
  </main>

  <div class="controls">
    <button id="play" class="primary">播放</button>
    <button id="jump">跳到报警</button>
    <button id="reset">回到第 1 帧</button>
    <input id="slider" aria-label="回放帧" type="range" min="0" max="@@MAX_INDEX@@" value="0">
    <span id="tlabel">—</span>
  </div>
  <canvas id="chart" width="1400" height="150"></canvas>

  <details class="notesbox">
    <summary>说明</summary>
    <div class="notes">
      @@NOTES@@
    </div>
  </details>

  <footer>
    <details class="notesbox">
      <summary>复现与参数</summary>
      <pre>@@REPRODUCE@@</pre>
      <details>
        <summary>SUMMARY</summary>
        <pre>@@SUMMARY_JSON@@</pre>
      </details>
    </details>
  </footer>
</div>

<script src="data/frames.js"></script>
<script>
(function () {
  'use strict';
  var FRAMES = window.FRAMES || [];
  var N = FRAMES.length;
  if (!N) {
    document.querySelector('.verdict').textContent = '数据缺失：data/frames.js 未加载';
    return;
  }
  var STATE_COLOR = {
    unknown: '#7c8a9c',
    upright: '#57e08d',
    descending: '#ff9f43',
    low_posture_unclassified: '#ffc857',
    suspected: '#ff4d5e',
    confirmed: '#ff2d43',
    recovering: '#57d9ff'
  };
  var STATE_TEXT = {
    unknown: '未知 / 未锁定',
    upright: '直立',
    descending: '下降中',
    low_posture_unclassified: '低位（未分类）',
    suspected: '跌倒嫌疑',
    confirmed: '确认跌倒',
    recovering: '恢复中'
  };
  var ALARM = { suspected: 1, confirmed: 1 };

  var cloud = document.getElementById('cloud');
  var ctx = cloud.getContext('2d');
  var chart = document.getElementById('chart');
  var cctx = chart.getContext('2d');
  var cam = document.getElementById('cam');
  var camNote = document.getElementById('camNote');
  var camMeta = document.getElementById('camMeta');
  var slider = document.getElementById('slider');
  var tlabel = document.getElementById('tlabel');
  var playBtn = document.getElementById('play');
  var alarmBox = document.getElementById('alarm');
  var alarmTitle = document.getElementById('alarmTitle');
  var alarmText = document.getElementById('alarmText');
  var metrics = document.getElementById('metrics');
  var sTrack = document.getElementById('sTrack');
  var sState = document.getElementById('sState');
  var sBase = document.getElementById('sBase');

  var index = 0, timer = null, playing = false, cameraRequest = 0, cameraCaption = '';
  var playWall = 0, playSource = 0;
  var live = !!window.RANGE_RUNTIME, following = live;
  var alarmFirst = -1, alarmRuns = [], timeOrdered = true;
  function measured(f) { return f.n > 0 && !!f.tid; }
  function effectiveState(f) { return measured(f) ? f.st : 'unknown'; }
  function continuous(a, b) {
    return a.tid === b.tid && a.generation === b.generation && b.i === a.i+1 &&
      b.t > a.t && b.t - a.t <= 0.3 + 1e-9;
  }
  function rebuildIntervals() {
  alarmFirst = -1; alarmRuns = []; timeOrdered = true;
  for (var k = 0; k < N; k++) {
    if (k && FRAMES[k].t <= FRAMES[k-1].t) timeOrdered = false;
    if (ALARM[FRAMES[k].st] && measured(FRAMES[k])) {
      if (alarmFirst < 0) alarmFirst = k;
      var lastRun = alarmRuns[alarmRuns.length - 1];
      if (lastRun && lastRun[1] === k-1 && continuous(FRAMES[k-1], FRAMES[k])) lastRun[1] = k;
      else alarmRuns.push([k, k]);
    }
  }
  }
  rebuildIntervals();
  function fraction(i) {
    return N <= 1 ? 0 : (timeOrdered ? (FRAMES[i].t-FRAMES[0].t)/(FRAMES[N-1].t-FRAMES[0].t) : i/(N-1));
  }

  // ---- 3D 视图（自写最小渲染器：lookAt + 透视 + 画家算法）
  var VIEW0 = @@VIEW@@;
  var SENSOR_ORIGIN = @@SENSOR_ORIGIN@@;
  var view = { yaw: VIEW0.yaw, pitch: VIEW0.pitch, dist: VIEW0.dist,
               tx: VIEW0.tx, ty: VIEW0.ty, tz: VIEW0.tz };
  var orbit = null;

  function stateLabel(f) {
    if (!f) return '—';
    if (f.st === 'unknown') {
      return '未知';
    }
    return STATE_TEXT[effectiveState(f)] || effectiveState(f);
  }

  function projectPoints(flat, eye, right, up, forward, focal, cx, cy) {
    var count = flat.length / 3;
    var out = new Float32Array(count * 3);
    for (var i = 0; i < count; i++) {
      var dx = flat[3 * i] / 100 - eye[0];
      var dy = flat[3 * i + 1] / 100 - eye[1];
      var dz = flat[3 * i + 2] / 100 - eye[2];
      var depth = dx * forward[0] + dy * forward[1] + dz * forward[2];
      if (depth <= 0.25) { out[3 * i + 2] = -1; continue; }
      var rx = dx * right[0] + dy * right[1] + dz * right[2];
      var uy = dx * up[0] + dy * up[1] + dz * up[2];
      out[3 * i] = cx + focal * rx / depth;
      out[3 * i + 1] = cy - focal * uy / depth;
      out[3 * i + 2] = depth;
    }
    return out;
  }

  function heightColor(z) {
    var t = Math.max(0, Math.min(1, z / 2.2));
    if (t < 0.5) {
      var a = t / 0.5;
      return [Math.round(46 + a * 12), Math.round(64 + a * 92), Math.round(96 + a * 92)];
    }
    var b = (t - 0.5) / 0.5;
    return [Math.round(58 + b * 168), Math.round(156 + b * 66), Math.round(188 - b * 60)];
  }

  function drawScene(frame) {
    var W = cloud.width, H = cloud.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#070a0f';
    ctx.fillRect(0, 0, W, H);
    var cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
    var eye = [
      view.tx + view.dist * cp * Math.cos(view.yaw),
      view.ty + view.dist * cp * Math.sin(view.yaw),
      view.tz + view.dist * sp
    ];
    var target = [view.tx, view.ty, view.tz];
    var forward = [target[0] - eye[0], target[1] - eye[1], target[2] - eye[2]];
    var fl = Math.hypot(forward[0], forward[1], forward[2]) || 1;
    forward = [forward[0] / fl, forward[1] / fl, forward[2] / fl];
    var upw = [0, 0, 1];
    var right = [forward[1] * upw[2] - forward[2] * upw[1],
                 forward[2] * upw[0] - forward[0] * upw[2],
                 forward[0] * upw[1] - forward[1] * upw[0]];
    var rl = Math.hypot(right[0], right[1], right[2]) || 1;
    right = [right[0] / rl, right[1] / rl, right[2] / rl];
    var up = [right[1] * forward[2] - right[2] * forward[1],
              right[2] * forward[0] - right[0] * forward[2],
              right[0] * forward[1] - right[1] * forward[0]];
    var focal = H * 0.95, cx = W / 2, cy = H / 2;

    // 地面网格
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(80,104,138,.30)';
    var grid = [];
    for (var gx = -1; gx <= 6; gx += 0.5) { grid.push([[gx, -4, 0], [gx, 4, 0]]); }
    for (var gy = -4; gy <= 4; gy += 0.5) { grid.push([[-1, gy, 0], [6, gy, 0]]); }
    for (var gi = 0; gi < grid.length; gi++) {
      var a = projectPoints(new Float32Array([grid[gi][0][0] * 100, grid[gi][0][1] * 100, 0]),
                            eye, right, up, forward, focal, cx, cy);
      var b = projectPoints(new Float32Array([grid[gi][1][0] * 100, grid[gi][1][1] * 100, 0]),
                            eye, right, up, forward, focal, cx, cy);
      if (a[2] > 0 && b[2] > 0) {
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
      }
    }

    // 场景点：按深度从远到近
    var scene = projectPoints(new Float32Array(frame.bg || []), eye, right, up, forward, focal, cx, cy);
    var order = [];
    for (var s = 0; s < scene.length / 3; s++) if (scene[3 * s + 2] > 0) order.push(s);
    order.sort(function (p, q) { return scene[3 * q + 2] - scene[3 * p + 2]; });
    for (var oi = 0; oi < order.length; oi++) {
      var si = order[oi];
      var x = scene[3 * si], y = scene[3 * si + 1];
      if (x < -20 || y < -20 || x > W + 20 || y > H + 20) continue;
      var col = heightColor((frame.bg[3 * si + 2] || 0) / 100);
      ctx.fillStyle = 'rgb(' + col[0] + ',' + col[1] + ',' + col[2] + ')';
      ctx.fillRect(x, y, 2, 2);
    }

    // 目标点
    var tgt = projectPoints(new Float32Array(frame.tg || []), eye, right, up, forward, focal, cx, cy);
    var torder = [];
    for (var t = 0; t < tgt.length / 3; t++) if (tgt[3 * t + 2] > 0) torder.push(t);
    torder.sort(function (p, q) { return tgt[3 * q + 2] - tgt[3 * p + 2]; });
    ctx.fillStyle = '#35ff7a';
    for (var ti = 0; ti < torder.length; ti++) {
      var tj = torder[ti];
      ctx.fillRect(tgt[3 * tj], tgt[3 * tj + 1], 3, 3);
    }

    // 绿框
    if (frame.bb) {
      var bb = frame.bb;
      var corners = [[bb[0], bb[1], bb[2]], [bb[3], bb[1], bb[2]], [bb[3], bb[4], bb[2]], [bb[0], bb[4], bb[2]],
                     [bb[0], bb[1], bb[5]], [bb[3], bb[1], bb[5]], [bb[3], bb[4], bb[5]], [bb[0], bb[4], bb[5]]];
      var flatc = new Float32Array(24);
      for (var c = 0; c < 8; c++) { flatc[3 * c] = corners[c][0]; flatc[3 * c + 1] = corners[c][1]; flatc[3 * c + 2] = corners[c][2]; }
      var pc = projectPoints(flatc, eye, right, up, forward, focal, cx, cy);
      var edges = [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]];
      ctx.strokeStyle = '#35ff7a';
      ctx.lineWidth = 2;
      ctx.shadowColor = 'rgba(53,255,122,.55)';
      ctx.shadowBlur = 7;
      ctx.beginPath();
      for (var e = 0; e < edges.length; e++) {
        var p0 = edges[e][0], p1 = edges[e][1];
        if (pc[3 * p0 + 2] <= 0 || pc[3 * p1 + 2] <= 0) continue;
        ctx.moveTo(pc[3 * p0], pc[3 * p0 + 1]);
        ctx.lineTo(pc[3 * p1], pc[3 * p1 + 1]);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // 传感器原点
    var origin = projectPoints(new Float32Array(SENSOR_ORIGIN), eye, right, up, forward, focal, cx, cy);
    if (origin[2] > 0) {
      ctx.fillStyle = '#57d9ff';
      ctx.beginPath(); ctx.arc(origin[0], origin[1], 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(180,225,245,.9)';
      ctx.font = '12px "Segoe UI",sans-serif';
      ctx.fillText('sensor', origin[0] + 8, origin[1] - 6);
    }

    // HUD
    ctx.fillStyle = 'rgba(230,238,248,.92)';
    ctx.font = '13px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.fillText('t = ' + frame.t.toFixed(2) + ' s   source frame ' + frame.i + ' · cache ' + N, 14, 22);
    if (frame.n > 0) {
      ctx.fillStyle = '#8ff7b6';
      ctx.fillText('目标点 ' + frame.n + '  ·  高度中位 ' + (frame.hm === null ? 'n/a' : frame.hm.toFixed(2) + ' m') +
                   '  ·  状态 ' + stateLabel(frame), 14, 42);
    } else {
      ctx.fillStyle = '#9fb0c6';
      ctx.fillText('未锁定目标（搜索中）', 14, 42);
    }
  }

  // ---- 高度曲线 / 状态条 / 报警区
  function drawChart() {
    var W = chart.width, H = chart.height;
    cctx.clearRect(0, 0, W, H);
    cctx.fillStyle = '#0b1018';
    cctx.fillRect(0, 0, W, H);
    var left = 46, right = W - 12, top = 10, bottom = H - 26;
    var maxH = 2.1;
    function X(i) { return left + (right - left) * fraction(i); }
    function Y(h) { return bottom - (bottom - top) * Math.max(0, Math.min(maxH, h)) / maxH; }

    cctx.strokeStyle = 'rgba(120,140,165,.28)';
    cctx.fillStyle = '#8c9cb2';
    cctx.font = '11px "Segoe UI",sans-serif';
    for (var hgt = 0; hgt <= 2; hgt += 0.5) {
      cctx.beginPath(); cctx.moveTo(left, Y(hgt)); cctx.lineTo(right, Y(hgt)); cctx.stroke();
      cctx.fillText(hgt.toFixed(1) + ' m', 6, Y(hgt) + 4);
    }
    // 低位阈值 0.7 m
    cctx.setLineDash([4, 4]);
    cctx.strokeStyle = 'rgba(255,184,77,.55)';
    cctx.beginPath(); cctx.moveTo(left, Y(0.7)); cctx.lineTo(right, Y(0.7)); cctx.stroke();
    cctx.setLineDash([]);

    // 状态条
    var stripY = bottom + 8, stripH = 10;
    for (var i = 0; i < N; i++) {
      cctx.fillStyle = STATE_COLOR[effectiveState(FRAMES[i])] || '#7c8a9c';
      var x0 = X(i), x1 = X(Math.min(N - 1, i + 1));
      if (i+1 < N && !continuous(FRAMES[i],FRAMES[i+1])) {
        cctx.fillRect(x0, stripY, 2, stripH);
        cctx.fillStyle = '#364252';
        cctx.fillRect(x0+2, stripY, Math.max(0,x1-x0-2), stripH);
      } else cctx.fillRect(x0, stripY, Math.max(1, x1 - x0), stripH);
    }

    // 报警区
    cctx.fillStyle = 'rgba(255,77,94,.14)';
    alarmRuns.forEach(function (run) {
      cctx.fillRect(X(run[0]), top, Math.max(2, X(run[1])-X(run[0])), bottom-top);
    });

    // 高度曲线
    cctx.strokeStyle = '#57d9ff';
    cctx.lineWidth = 1.6;
    cctx.beginPath();
    var started = false;
    for (var j = 0; j < N; j++) {
      var f = FRAMES[j];
      if (!Number.isFinite(f.hm) || !measured(f)) { started = false; continue; }
      if (j && !continuous(FRAMES[j-1], f)) started = false;
      var px = X(j), py = Y(f.hm);
      if (!started) { cctx.moveTo(px, py); started = true; } else { cctx.lineTo(px, py); }
    }
    cctx.stroke();

    // 当前帧
    cctx.strokeStyle = '#e8eef7';
    cctx.lineWidth = 1;
    cctx.beginPath(); cctx.moveTo(X(index), top); cctx.lineTo(X(index), bottom); cctx.stroke();
    cctx.fillStyle = '#e8eef7';
    if (measured(FRAMES[index]) && Number.isFinite(FRAMES[index].hm)) {
      cctx.beginPath(); cctx.arc(X(index), Y(FRAMES[index].hm), 3, 0, Math.PI * 2); cctx.fill();
    }

    cctx.fillStyle = '#8c9cb2';
    cctx.font = '11px "Segoe UI","Microsoft YaHei",sans-serif';
    cctx.fillText('目标高度中位（m）· 底部色条 = 逐帧状态 · 红区 = 跌倒嫌疑', left, H - 3);
    if (alarmFirst >= 0) {
      cctx.fillStyle = '#ff8d97';
      cctx.fillText('报警 ' + FRAMES[alarmFirst].t.toFixed(2) + ' s', Math.min(right - 60, X(alarmFirst) + 6), top + 12);
    }
  }

  function fmt(value, digits, unit) {
    if (value === null || value === undefined) return 'n/a';
    return Number(value).toFixed(digits) + (unit || '');
  }

  function render() {
    var f = FRAMES[index];
    drawScene(f);
    drawChart();

    if (f.cam && Number.isFinite(f.cam[1]) && Math.abs(f.cam[1]) <= 0.2 && f.cam_status !== 'stale') {
      var path = live ? '/camera.jpg?i=' + f.cam[0] : 'camera/c' + String(f.cam[0]).padStart(3, '0') + '.jpg';
      var caption = '相机帧 #' + f.cam[0] + ' · 接收时刻 - 雷达帧时刻 = ' +
        (f.cam[1] >= 0 ? '+' : '') + f.cam[1].toFixed(3) + ' s · 物理同步UNKNOWN';
      cameraCaption = caption;
      if (cam.getAttribute('src') !== path) {
        var request = ++cameraRequest;
        cam.style.visibility = 'hidden'; camNote.textContent = '相机帧加载中';
        cam.onload = function () {
          if (request !== cameraRequest || cam.getAttribute('src') !== path) return;
          cam.style.visibility = 'visible'; camNote.textContent = cameraCaption;
        };
        cam.onerror = function () {
          if (request !== cameraRequest) return;
          cam.style.visibility = 'hidden'; camNote.textContent = '相机帧加载失败';
        };
        cam.setAttribute('src', path);
      } else if (cam.style.visibility === 'visible') camNote.textContent = caption;
      camMeta.textContent = '相机帧 #' + f.cam[0];
    } else {
      cameraRequest++;
      cam.removeAttribute('src');
      cam.style.visibility = 'hidden';
      camNote.textContent = f.cam ? '相机近邻超过0.20s显示预算，当前画面未知' : '本帧没有可配对相机录像帧';
      camMeta.textContent = f.cam ? '相机过期' : '无相机';
    }

    var hot = measured(f) && !!ALARM[f.st];
    var warm = measured(f) && (f.st === 'low_posture_unclassified' || f.st === 'descending' || f.st === 'recovering');
    alarmBox.className = 'alarm ' + (hot ? 'hot' : (warm ? 'warm' : 'idle'));
    if (hot) {
      alarmTitle.textContent = f.st === 'confirmed' ? '确认跌倒' : '⚠ 跌倒嫌疑';
      var currentRun = alarmRuns.filter(function (run) { return run[0] <= index && run[1] >= index; })[0];
      alarmText.textContent = 't = ' + f.t.toFixed(2) + ' s · 本段起于 ' + FRAMES[currentRun[0]].t.toFixed(2) +
        ' s · 原因 ' + (f.rs || []).join(', ');
    } else if (warm) {
      alarmTitle.textContent = '低位 / 过渡';
      alarmText.textContent = 't = ' + f.t.toFixed(2) + ' s';
    } else {
      alarmTitle.textContent = !measured(f) || f.st === 'unknown' ? '状态未知' : '当前无跌倒候选';
      alarmText.textContent = !measured(f) ? '无当前实测目标 · ' + (f.target_reason || '未锁定/预测/歧义') : 't = ' + f.t.toFixed(2) + ' s';
    }

    sTrack.textContent = f.tid ? f.tid : '未锁定';
    sTrack.style.color = f.tid ? '#9df0bd' : '#93a1b5';
    sState.textContent = measured(f) ? stateLabel(f) : '未知';
    sState.style.color = STATE_COLOR[effectiveState(f)] || '#e8eef7';
    sBase.textContent = f.bl === null ? '未建立' : ('v' + f.bl);

    metrics.innerHTML = [
      ['目标点数', f.n ? String(f.n) : '0'],
      ['高度中位', fmt(f.hm, 2, ' m')],
      ['顶部高度', fmt(f.ht, 2, ' m')],
      ['水平跨度', fmt(f.sp, 2, ' m')],
      ['下降速率', fmt(f.rt, 2, ' m/s')],
      ['竖直度', fmt(f.vt, 2, '')],
      ['状态', stateLabel(f)],
      ['原因码', (f.rs && f.rs.length) ? f.rs.join(', ') : '—'],
      ['代次 / 重置', String(f.generation === undefined ? '历史未记录' : f.generation) + ' / ' + (f.reset_reason || '—')]
    ].map(function (row) {
      return '<div class="metric"><span>' + escapeHtml(row[0]) + '</span><b>' + escapeHtml(row[1]) + '</b></div>';
    }).join('');

    slider.value = String(index);
    tlabel.textContent = '帧 ' + index + ' / ' + (N - 1) + ' · t = ' + f.t.toFixed(2) + ' s' +
      (timeOrdered ? '' : ' · 时钟回退，图轴按帧序');
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }
  function schedule() {
    clearTimeout(timer); timer = null;
    if (live) return;
    if (!playing) return;
    if (index >= N-1) { playing = false; playBtn.textContent = '播放'; return; }
    var delta = FRAMES[index+1].t-FRAMES[index].t;
    var delay = delta > 0 ? Math.max(0, playWall+(FRAMES[index+1].t-playSource)*1000-performance.now()) : 100;
    timer = setTimeout(function () { timer = null; show(index+1, true); }, delay);
  }
  function show(next, fromPlayback) {
    if (live && !fromPlayback) { following = false; playBtn.textContent = '跟随最新'; }
    var previous = index;
    index = Math.max(0, Math.min(N - 1, next));
    if (playing && (!fromPlayback || FRAMES[index].t <= FRAMES[previous].t)) {
      playWall = performance.now(); playSource = FRAMES[index].t;
    }
    render();
    schedule();
  }

  slider.max = String(N - 1);
  slider.addEventListener('input', function (event) {
    show(parseInt(event.target.value, 10));
  });
  document.getElementById('reset').addEventListener('click', function () {
    show(0);
  });
  document.getElementById('jump').addEventListener('click', function () {
    show(alarmFirst >= 0 ? alarmFirst : 0);
  });
  playBtn.addEventListener('click', function () {
    if (live) {
      following = !following; playBtn.textContent = following ? '暂停跟随' : '跟随最新';
      if (following) { index = N-1; render(); }
      return;
    }
    playing = !playing;
    playBtn.textContent = playing ? '暂停' : '播放';
    if (playing && index === N-1) index = 0;
    if (playing) { playWall = performance.now(); playSource = FRAMES[index].t; }
    render(); schedule();
  });
  window.addEventListener('keydown', function (event) {
    if (event.key === 'ArrowLeft') { show(index - 1); event.preventDefault(); }
    if (event.key === 'ArrowRight') { show(index + 1); event.preventDefault(); }
    if (event.key === ' ') { playBtn.click(); event.preventDefault(); }
  });

  chart.addEventListener('click', function (event) {
    var rect = chart.getBoundingClientRect();
    var left = 46, right = chart.width - 12;
    var x = (event.clientX - rect.left) / rect.width * chart.width;
    var ratio = Math.max(0, Math.min(1, (x - left) / (right - left)));
    var closest = 0;
    for (var j = 1; j < N; j++) if (Math.abs(fraction(j)-ratio) < Math.abs(fraction(closest)-ratio)) closest = j;
    show(closest);
  });

  cloud.addEventListener('pointerdown', function (event) {
    orbit = { x: event.clientX, y: event.clientY, yaw: view.yaw, pitch: view.pitch };
    cloud.classList.add('drag');
    cloud.setPointerCapture(event.pointerId);
  });
  cloud.addEventListener('pointermove', function (event) {
    if (!orbit) return;
    view.yaw = orbit.yaw + (event.clientX - orbit.x) * 0.008;
    view.pitch = Math.max(-0.05, Math.min(1.35, orbit.pitch + (event.clientY - orbit.y) * 0.006));
    drawScene(FRAMES[index]);
  });
  cloud.addEventListener('pointerup', function () { orbit = null; cloud.classList.remove('drag'); });
  cloud.addEventListener('wheel', function (event) {
    view.dist = Math.max(4, Math.min(30, view.dist * (1 + Math.sign(event.deltaY) * 0.08)));
    drawScene(FRAMES[index]);
    event.preventDefault();
  }, { passive: false });
  cloud.addEventListener('dblclick', function () {
    view.yaw = VIEW0.yaw; view.pitch = VIEW0.pitch; view.dist = VIEW0.dist;
    view.tx = VIEW0.tx; view.ty = VIEW0.ty; view.tz = VIEW0.tz;
    drawScene(FRAMES[index]);
  });

  var opening = 0;
  for (var oi2 = 0; oi2 < N; oi2++) { if (FRAMES[oi2].n > 0) { opening = oi2; break; } }
  show(opening);
  if (live) {
    following = true; playBtn.textContent = '暂停跟随';
    window.rangeRuntimeAppend = function (payload) {
      var selected = FRAMES[index], added = false;
      (payload.rows || []).forEach(function (item) {
        if (item.seq <= (window.rangeRuntimeSeq || 0)) return;
        if (!window.rangeRuntimeSeq) {
          FRAMES.length = 0;
          if (!following) FRAMES.push(selected);
        }
        FRAMES.push(item.frame); window.rangeRuntimeSeq = item.seq; added = true;
      });
      if (!added) return;
      if (FRAMES.length > 240) {
        var pinned = !following && FRAMES.indexOf(selected) >= 0 ? selected : null;
        FRAMES.splice(0, FRAMES.length-(pinned ? 239 : 240));
        if (pinned && FRAMES.indexOf(pinned) < 0) FRAMES.unshift(pinned);
      }
      N = FRAMES.length;
      index = following ? N-1 : Math.max(0, FRAMES.indexOf(selected));
      slider.max = String(N-1); rebuildIntervals(); render();
    };
  }
})();
</script>
</body>
</html>
