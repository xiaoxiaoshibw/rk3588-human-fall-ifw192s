<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>LiDAR Workspace</title>
<link rel="icon" href="console_icon.ico" type="image/x-icon">
<style>
  /* 设计 token 与 human_replay/ui.css 保持同值；本页因 PyInstaller 单文件打包必须内联 */
  :root{
    --bg-app:#141518; --bg-sidebar:#1a1b1f; --bg-panel:#1e1f24; --bg-elevated:#242630;
    --bg-inset:#101114;
    --border-subtle:#26282d; --border-strong:#34373e;
    --text-primary:#e7e8ea; --text-secondary:#a0a3ab; --text-muted:#676b73;
    --accent:#5c8ade; --accent-soft:rgba(92,138,222,.14);
    --success:#4bab7d; --warning:#d0a75a; --danger:#d46a62; --danger-soft:rgba(212,106,98,.13);
    --font-ui:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,
              "Microsoft YaHei UI","Microsoft YaHei","PingFang SC",sans-serif;
    --r-panel:6px; --r-ctl:4px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg-app);color:var(--text-primary);
    font:13px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}
  .view{height:100%;display:none}
  .view.on{display:flex;flex-direction:column}

  /* ===== 首页：Launchpad，内容上置，不绝对居中 ===== */
  #home{align-items:center;overflow-y:auto}
  #wrap{width:100%;max-width:1100px;padding:96px 40px 48px}
  #wrap .brand{font-size:19px;font-weight:600;letter-spacing:.2px;margin:0}
  #wrap .brand-sub{font-size:12px;color:var(--text-muted);margin:4px 0 36px}
  #grid{display:block}
  .group{margin-bottom:20px}
  .group .gtitle{font-size:11.5px;letter-spacing:.5px;color:var(--text-muted);margin:0 0 6px;
    padding-left:8px;border-left:2px solid var(--border-strong)}
  .group .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
  .group .cards[hidden]{display:none}
  .group.archived{margin-top:34px;padding-top:14px;border-top:1px solid var(--border-subtle)}
  .gtoggle{display:inline-block;font:11.5px var(--font-ui);letter-spacing:.4px;color:var(--text-muted);
    background:transparent;border:1px solid var(--border-subtle);border-radius:var(--r-ctl);
    padding:5px 10px;margin:0 0 10px 2px;cursor:pointer}
  .gtoggle:hover{color:var(--text-primary);border-color:var(--border-strong);background:var(--bg-elevated)}
  .card{display:flex;flex-direction:column;gap:2px;padding:16px 14px;border-radius:var(--r-panel);
    cursor:pointer;transition:background .12s}
  .card:hover{background:var(--bg-elevated)}
  .card .icon{color:var(--text-secondary);height:22px;margin-bottom:8px}
  .card .icon svg{display:block}
  .card:hover .icon{color:var(--accent)}
  .card .name{font-size:13px;font-weight:600;color:var(--text-primary)}
  .card .desc{font-size:12px;color:var(--text-muted)}

  /* ===== 应用视图 ===== */
  #bar{display:flex;gap:8px;align-items:center;padding:0 12px;height:44px;flex:none;
    background:var(--bg-sidebar);border-bottom:1px solid var(--border-subtle)}
  #bar button{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;
    padding:0 10px;font:12.5px var(--font-ui);color:var(--text-secondary);background:transparent;
    border:1px solid transparent;border-radius:var(--r-ctl);cursor:pointer;transition:background .12s,color .12s}
  #bar button:hover{background:var(--bg-elevated);color:var(--text-primary)}
  #appname{font-size:13px;font-weight:600;white-space:nowrap}
  #bar .sp{flex:1}
  iframe{flex:1;border:0;width:100%;background:var(--bg-inset)}
  iframe[hidden]{display:none}

  /* ===== 不可达提示（保持 #err flex + [hidden] 契约） ===== */
  #err{display:flex;flex-direction:column;justify-content:center;align-items:center;
    gap:14px;flex:1;background:var(--bg-app);margin:0}
  #err[hidden]{display:none}   /* [hidden] 的 UA 默认会被上面 display:flex 盖掉，须显式拉回 */
  #err .ic{color:var(--text-muted)}
  #err .t1{font-size:14px;color:var(--text-primary)}
  #err .t2{font-size:12px;color:var(--text-muted);font-family:"Cascadia Mono",Consolas,monospace}
  #err button{display:inline-flex;align-items:center;height:30px;padding:0 16px;
    font:12.5px var(--font-ui);color:var(--text-primary);background:var(--bg-elevated);
    border:1px solid var(--border-strong);border-radius:var(--r-ctl);cursor:pointer}
  #err button:hover{border-color:#3f434b;background:#2b2d34}
</style>
</head>
<body>
<section id="home" class="view on">
  <div id="wrap">
    <h1 class="brand">LiDAR Workspace</h1>
    <div class="brand-sub">IFW192S · 点云回放 / 算法验证 / 人体识别</div>
    <div id="grid"></div>
  </div>
</section>
<section id="app" class="view">
  <div id="bar">
    <button id="back"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>总控</button>
    <b id="appname"></b>
    <span class="sp"></span>
    <button id="pop" title="新窗口打开当前应用"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>新窗口</button>
  </div>
  <iframe id="f"></iframe>
  <div id="err" hidden>
    <div class="ic"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></div>
    <div class="t1" id="errmsg"></div>
    <div class="t2" id="errurl"></div>
    <button id="retry">重试</button>
  </div>
</section>
<script>
// ============ 扩展点：未来新入口在 APPS 数组追加即可 ============
// mode: "iframe"(默认，嵌在控制台里)  / "tab"(应用视图点 ↗ 或条目直接开新标签，
//         留给将来拒绝内嵌的站点，如服务端设了 X-Frame-Options)
const requestedPort = Number(new URLSearchParams(location.search).get("replay_port") || 8901);
const replayBase = "http://127.0.0.1:" + (Number.isInteger(requestedPort) && requestedPort > 0 && requestedPort <= 65535 ? requestedPort : 8901);
const fallPort = Number(new URLSearchParams(location.search).get("fall_port"));
const fallBase = Number.isInteger(fallPort) && fallPort > 0 && fallPort <= 65535 ? "http://127.0.0.1:" + fallPort : null;
const realFallPort = Number(new URLSearchParams(location.search).get("real_fall_port"));
const realFallBase = Number.isInteger(realFallPort) && realFallPort > 0 && realFallPort <= 65535 ? "http://127.0.0.1:" + realFallPort : null;
const capturePort = Number(new URLSearchParams(location.search).get("capture_port"));
const captureBase = Number.isInteger(capturePort) && capturePort > 0 && capturePort <= 65535 ? "http://127.0.0.1:" + capturePort : null;
const planePort = Number(new URLSearchParams(location.search).get("plane_port"));
const planeBase = Number.isInteger(planePort) && planePort > 0 && planePort <= 65535 ? "http://127.0.0.1:" + planePort : null;
// 线性 SVG 图标（Lucide 风格内嵌，不引外部资源）
const svg = p => '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>';
// 首页分栏分组（用户 2026-10-15 直派「把这些模块收纳归类」）；顺序即渲染顺序，
// group 必须取自本表，未知 group 会落到最后「其他」栏（有测试禁止出现）。
const GROUPS = ["采集录制", "回放与标注", "检测与研究", "板端与平台", "数据管理"];
// 研究/研究性算法页（现在用不到）归到首页最下面的「归档」区：默认折叠、页面与代码都还在，
// 只是不再占启动页版面。要回到可见区：把该条的 archived 去掉即可（一行）。
const APPS = [
  {name:"会话回放",  desc:"replay · 本地服务",      group:"回放与标注", icon:svg('<path d="m6 4 14 8-14 8Z"/>'), url:replayBase + "/"},
  {name:"板端 WebUI", desc:"RK3588 · 192.168.31.58:8090", group:"板端与平台", icon:svg('<rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>'), url:"http://192.168.31.58:8090/",
   fail:"当前不在内网，无法连接板端 WebUI"},
  {name:"USB 摄像头", desc:"RK3588 · 192.168.31.58:8081 MJPEG", group:"采集录制", icon:svg('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M2 12h2"/><path d="M20 12h2"/>'), url:"http://192.168.31.58:8081/stream"},  // 2026-10-14 去掉 mode:"tab"：iframe 内嵌预览。pywebview 吞顶层 window.open 是"卡片点不开"的根因
  {name:"算法验证", desc:"四区评估 · TLS / SVD / RANSAC", group:"检测与研究", archived:true, icon:svg('<path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/>'), url:replayBase + "/validation.html"},
  {name:"人体识别", desc:"纯几何 · pin ROI 辅助判别人/家具 · 不跑模型", group:"检测与研究", archived:true, icon:svg('<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>'), url:replayBase + "/human_detect.html"},
  {name:"人检锁定", desc:"B2a RandomForest 51维人/非人 · rf_person_v1 · 实时跟踪", group:"检测与研究", archived:true, icon:svg('<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M2 12h2"/><path d="M20 12h2"/>'), url:replayBase + "/human_track.html"},
  {name:"GT 标注", desc:"2D 点云人工 GT 工作台 · 跨帧 track · 冻结版本", group:"回放与标注", icon:svg('<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>'), url:replayBase + "/gt_annotator.html"},
  {name:"骨架与倒地检测", desc:"八段动作 · 中央人体 / 点支撑骨架 / 倒地姿态候选", group:"检测与研究", archived:true, icon:svg('<circle cx="12" cy="4" r="2"/><path d="M12 6v8m-6-5 6 2 6-2m-6 5-5 7m5-7 5 7"/>'), url:fallBase ? fallBase + "/" : "about:blank",
   unavailable:fallBase ? null : "当前工作区的真人回放数据未就绪，请在原工作区重新打开总控制台"},
  {name:"真人倒地回放", desc:"真实录制 · 点支撑粗部位 / 未确认原型告警", group:"检测与研究", archived:true, icon:svg('<circle cx="12" cy="4" r="2"/><path d="M12 6v8m-6-5 6 2 6-2m-6 5-5 7m5-7 5 7"/>'), url:realFallBase ? realFallBase + "/" : "about:blank",
   unavailable:realFallBase ? null : "真实倒地回放数据未就绪，请从原工作区重新打开总控制台"},
  {name:"USB＋雷达联合录制", desc:"板端先存 · 拉回完成后自动打开回放", group:"采集录制", icon:svg('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>'), url:captureBase ? captureBase + "/" : "about:blank",
   unavailable:captureBase ? null : "请重新打开总控制台以启动本机联合录制服务"},
  {name:"小目标跟踪", desc:"PLANE-01 · 纸飞机 3D / 去背景 / 跟踪证据页", group:"检测与研究", archived:true, icon:svg('<path d="m3 11 18-8-8 18-2-8-8-2Z"/>'), url:planeBase ? planeBase + "/index.html" : "about:blank",
   unavailable:planeBase ? null : "证据页面目录 plane01_pages 未随本次控制台启动，请用仓库内总控制台打开"},
  {name:"会话数据库", desc:"会话总表 · 清单(字节/sha256) · 本机/板端分级删除", group:"数据管理", icon:svg('<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/>'), url:replayBase + "/sessions_db.html"},
];
const learnRun = new URLSearchParams(location.search).get("learn_run");
if (fallBase && learnRun && /^[A-Za-z0-9_-]+$/.test(learnRun)) {
  APPS.push({name:"逐源标注与学习对照", desc:"HFUS E0 · 人工审核 / 多层深度 / 冻结几何；学习未训练", group:"检测与研究", archived:true,
    icon:svg('<circle cx="8" cy="8" r="3"/><circle cx="16" cy="16" r="3"/><path d="m10 10 4 4"/>'),
    url:fallBase + "/learn/" + encodeURIComponent(learnRun) + "/"});
}
// ============================================================
const $ = s => document.querySelector(s);
const home = $("#home"), appv = $("#app"), f = $("#f");
let cur = 0, loaded = -1;
let pendingSid = null;   // 联合录制拉回完成 → 打开会话回放时用 ?sid 载入该会话

// 应用条目（未上线的功能不渲染占位卡片）：按 group 分栏，栏内保持 APPS 原顺序；
// archived 的条目收进最下面「归档」区（默认折叠，点标题展开；页面/代码仍在，索引不变）
function make_card(a, i) {
  const d = document.createElement("div");
  d.className = "card";
  d.innerHTML = `<div class="icon">${a.icon}</div><div class="name">${a.name}</div><div class="desc">${a.desc}</div>`;
  d.onclick = () => a.mode === "tab" ? window.open(a.url, "_blank") : open(i);
  return d;
}
GROUPS.forEach(g => {
  const picked = [];
  APPS.forEach((a, i) => { if (!a.archived && a.group === g) picked.push([a, i]); });
  if (!picked.length) return;
  const sec = document.createElement("div");
  sec.className = "group";
  sec.innerHTML = `<div class="gtitle">${g}</div>`;
  const cards = document.createElement("div");
  cards.className = "cards";
  picked.forEach(([a, i]) => cards.appendChild(make_card(a, i)));
  sec.appendChild(cards);
  $("#grid").appendChild(sec);
});
const archived = [];
APPS.forEach((a, i) => { if (a.archived) archived.push([a, i]); });
if (archived.length) {
  const sec = document.createElement("div");
  sec.className = "group archived";
  const toggle = document.createElement("button");
  toggle.className = "gtoggle";
  toggle.textContent = `归档 · ${archived.length} 项（现在用不到的研究/算法页；点开显示）`;
  const cards = document.createElement("div");
  cards.className = "cards";
  cards.hidden = true;
  toggle.onclick = () => {
    cards.hidden = !cards.hidden;
    toggle.textContent = (cards.hidden ? "归档 · " + archived.length + " 项（现在用不到的研究/算法页；点开显示）"
                                       : "归档 · " + archived.length + " 项（点标题收起）");
  };
  archived.forEach(([a, i]) => cards.appendChild(make_card(a, i)));
  sec.appendChild(toggle);
  sec.appendChild(cards);
  $("#grid").appendChild(sec);
}

const err = $("#err");

function showErr(a) {
  $("#errmsg").textContent = a.fail;
  $("#errurl").textContent = new URL(a.url).origin;
  f.hidden = true; err.hidden = false;
}

// 跨域 iframe 读不到 location（成功页和浏览器错误页都抛 SecurityError），
// 只能自己探活：no-cors fetch 拿到响应=板可达，连接失败=不在内网。
// 带 fail 文案的应用才探活；本地应用直接嵌。
function load(i) {
  const a = APPS[i];
  err.hidden = true; f.hidden = false;
  const sidQuery = (i === 0 && pendingSid) ? "?sid=" + encodeURIComponent(pendingSid) : "";
  pendingSid = null;
  if (a.unavailable) { showErr({...a, fail:a.unavailable}); $("#errurl").textContent = "本地离线回放"; return; }
  if (!a.fail) { f.src = a.url + sidQuery; return; }
  fetch(a.url, {mode: "no-cors", cache: "no-store"})
    .then(() => { f.src = a.url + sidQuery; }, () => showErr(a));
}

function open(i) {
  cur = i;
  $("#appname").textContent = APPS[i].name;
  if (loaded !== i) {                                 // 重进同应用不重载，保留页内状态
    loaded = i; load(i);
  }
  home.classList.remove("on"); appv.classList.add("on");
  if (location.hash !== "#" + i) history.replaceState(null, "", "#" + i);
}
function back() {
  appv.classList.remove("on"); home.classList.add("on");
  history.replaceState(null, "", location.pathname + location.search); // 保留本实例服务端口
}
$("#back").onclick = back;
$("#pop").onclick = () => window.open(APPS[cur].url, "_blank");
$("#retry").onclick = () => load(cur);

// 联合录制拉回（下载）完成 → 自动切到「会话回放」并载入该会话；只认本实例联合录制服务来的消息
window.addEventListener("message", e => {
  const d = e.data;
  if (!captureBase || e.origin !== captureBase || !d || d.type !== "joint-completed") return;
  if (typeof d.sid !== "string" || !/^[A-Za-z0-9_-]{1,100}$/.test(d.sid)) return;
  pendingSid = d.sid;
  loaded = -1;   // 已开过回放也强制重载，让 ?sid 生效
  open(0);
});

// ponytail: iframe 内导航不跟踪；子站被 X-Frame-Options 挡时用 mode:"tab" 或 ↗
const h = parseInt(location.hash.slice(1), 10);
if (Number.isInteger(h) && APPS[h]) open(h);
</script>
</body>
</html>
