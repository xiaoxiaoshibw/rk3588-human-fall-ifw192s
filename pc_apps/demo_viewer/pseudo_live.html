<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>动作检测 · 本机伪实时</title><style>
:root{color-scheme:dark}body{margin:0;background:#0b1119;color:#e9f2fb;font:15px 'Microsoft YaHei',sans-serif}main{max-width:1450px;margin:auto;padding:20px}h1{font-size:23px;margin:0}p{color:#aab9c9}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0}button,select{background:#1c3041;color:#eef8ff;border:1px solid #345064;border-radius:7px;padding:9px 14px;font:inherit}button{cursor:pointer}.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}@media(max-width:850px){.grid{grid-template-columns:1fr}}section{border:1px solid #26394c;border-radius:12px;background:#111c28;overflow:hidden}h2{font-size:15px;margin:0;padding:10px 14px;background:#182839}canvas{width:100%;display:block;background:#080e16;touch-action:none}#depth{width:100%;height:auto;image-rendering:pixelated;background:black;display:block;aspect-ratio:4/3}.foot{padding:12px 14px;color:#b2c3d3}.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.stat{background:#172536;border:1px solid #273c4d;border-radius:8px;padding:10px 14px}.stat strong{color:#82ead7}.alert{color:#ffc878!important}.sub{font-size:13px;color:#a5b5c6}#status{color:#9fd5ff}
</style></head><body><main><h1>动作检测 · 本机伪实时回放</h1><p>逐帧运行共享检测链 · 2D 径向距离与 3D 点云来自同一帧</p><div class="controls"><select id="session"><option value="houdao">向后倒地</option><option value="qiandao">向前倒地</option><option value="huanmandiedao">缓慢倒地</option><option value="jixiedaiwanyao">系鞋带与弯腰</option></select><button id="start">开始 / 重播</button><button id="pause">暂停</button><span id="status">选择会话后开始</span></div><div class="grid"><section><h2>3D 实测点云 · 白绿为当前目标候选</h2><canvas id="cloud" width="960" height="640"></canvas><div class="foot">拖动旋转 · 滚轮缩放 · 场景点为显示抽样</div></section><section><h2>2D 径向距离图 · 白色为同帧目标</h2><img id="depth" alt="雷达距离图"><div class="foot">近 <span style="color:#ff6456">红</span> → <span style="color:#85dd8b">绿</span> → <span style="color:#76aaff">蓝</span> 远；黑色为无测量，显示范围 0.1–8 米。</div></section></div><div class="stats"><div class="stat">当前帧 <strong id="frame">—</strong></div><div class="stat">几何动作 <strong id="activity">—</strong></div><div class="stat">姿态 <strong id="posture">—</strong></div><div class="stat">持续低位 <strong id="duration">—</strong></div><div class="stat">目标点 <strong id="points">—</strong></div><div class="stat">单帧处理 <strong id="cost">—</strong></div></div><p class="sub">本次会话没有已声明空场前缀，背景按整段计算、地面为离线拟合；之后逐帧推理。几何候选可能误选，低位可能是主动躺下或坐卧；人体与跌倒真值未知，不能视为真实跌倒确认。</p></main><script>
'use strict';let generation=0,paused=false,last=null,yaw=-.8,pitch=.45,scale=95,drag=null;const $=id=>document.getElementById(id),ctx=$('cloud').getContext('2d');
const labels={unknown:'未知',standing:'站立形态',sitting:'坐姿形态',transitioning:'姿态过渡',vertical_surface:'竖直表面',lying_pending:'水平低位观察中',lying_candidate:'水平低位候选',low_horizontal_pending:'水平低位观察中',low_horizontal_candidate:'持续水平低位 ≥1.5 秒',low_horizontal_sustained:'持续水平低位 ≥3 秒',descending:'下降中',recovering:'恢复中',fall_suspected:'跌倒疑似'};
function draw(f){if(!f)return;const c=$('cloud');ctx.fillStyle='#080e16';ctx.fillRect(0,0,c.width,c.height);function project(x,y,z){x=x/100-2;y/=100;z=z/100-.8;let a=x*Math.cos(yaw)-y*Math.sin(yaw),b=x*Math.sin(yaw)+y*Math.cos(yaw);return [c.width/2+a*scale,c.height/2-(z*Math.cos(pitch)-b*Math.sin(pitch))*scale]};ctx.strokeStyle='#263846';ctx.lineWidth=1;for(let k=-4;k<=4;k++){let a=project(-100,k*100,0),b=project(600,k*100,0);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();a=project(k*100,-400,0);b=project(k*100,400,0);ctx.beginPath();ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke()}function dots(points,color,size){ctx.fillStyle=color;for(let i=0;i<points.length;i+=3){const p=project(points[i],points[i+1],points[i+2]);ctx.fillRect(p[0],p[1],size,size)}}dots(f.scene,'#668396',2);dots(f.target,'#7df5c5',4)}
$('cloud').onpointerdown=e=>{drag=[e.clientX,e.clientY,yaw,pitch];e.target.setPointerCapture(e.pointerId)};$('cloud').onpointermove=e=>{if(drag){yaw=drag[2]+(e.clientX-drag[0])*.01;pitch=Math.max(-1.3,Math.min(1.3,drag[3]+(e.clientY-drag[1])*.01));draw(last)}};$('cloud').onpointerup=()=>drag=null;$('cloud').onwheel=e=>{e.preventDefault();scale=Math.max(25,Math.min(300,scale*(e.deltaY>0?.9:1.1)));draw(last)};
function render(f){last=f;draw(f);$('depth').src=f.depth;$('frame').textContent=f.i+' · '+f.t.toFixed(2)+' 秒';$('activity').textContent=labels[f.activity.label]||f.activity.label;$('activity').className=f.activity.level?'alert':'';$('posture').textContent=labels[f.activity.posture]||f.activity.posture;$('duration').textContent=f.activity.low_duration_s.toFixed(2)+' 秒';$('points').textContent=f.n;$('cost').textContent=f.processing_ms.toFixed(0)+' 毫秒'}
const wait=ms=>new Promise(r=>setTimeout(r,ms));async function run(g){let prev=null;while(g===generation){if(paused){await wait(100);continue}let now=performance.now();let response=await fetch('/next');if(!response.ok)throw Error(await response.text());let f=await response.json();if(!f){$('status').textContent='回放完成';return}if(g!==generation)return;render(f);$('status').textContent='正在逐帧计算';let nextDelay=prev===null?100:Math.max(0,(f.t-prev)*1000);prev=f.t;await wait(Math.max(0,nextDelay-(performance.now()-now)))}}
$('start').onclick=async()=>{let g=++generation;paused=false;$('pause').textContent='暂停';$('status').textContent='正在准备离线背景和地面…';try{let response=await fetch('/start?name='+encodeURIComponent($('session').value));if(!response.ok)throw Error(await response.text());let info=await response.json();if(g!==generation)return;$('status').textContent='准备完成 '+info.prepare_s.toFixed(1)+' 秒';await run(g)}catch(e){$('status').textContent='出错：'+e.message}};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'继续':'暂停'};
</script></body></html>
