<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>会话回放 · LiDAR Workspace</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="ui.css">
<style>
  /* 全屏 Viewer 页：画布铺满，信息以悬浮 chip 呈现 */
  body { background: var(--bg-inset); }
  #view { position: absolute; inset: 0; }

  /* —— 悬浮信息 chip —— */
  #hud { position: absolute; top: 10px; left: 10px; padding: 5px 9px;
         background: rgba(26,27,31,.88); border: 1px solid var(--border-subtle); border-radius: var(--r-ctl);
         color: var(--text-secondary); font: 11.5px var(--font-mono); pointer-events: none; white-space: pre; z-index: 5; }
  #frameInfo { position: absolute; top: 40px; left: 10px; padding: 3px 9px;
         background: rgba(26,27,31,.88); border: 1px solid var(--border-subtle); border-radius: var(--r-ctl);
         color: var(--text-muted); font: 11.5px var(--font-mono); pointer-events: none; z-index: 5; }
  #flyHud { position: absolute; top: 72px; left: 10px; display: none; padding: 4px 9px;
         background: rgba(26,27,31,.88); border: 1px solid var(--border-subtle); border-radius: var(--r-ctl);
         color: var(--text-secondary); font-size: 11px; pointer-events: none; z-index: 5; }
  #coordHud { position: absolute; bottom: 40px; left: 10px; padding: 3px 9px;
         background: rgba(26,27,31,.88); border: 1px solid var(--border-subtle); border-radius: var(--r-ctl);
         color: var(--text-muted); font: 11.5px var(--font-mono); pointer-events: none; min-width: 200px; z-index: 5; }
  #status { position: absolute; bottom: 40px; left: 230px; padding: 3px 9px;
         background: rgba(26,27,31,.88); border: 1px solid var(--border-subtle); border-radius: var(--r-ctl);
         color: var(--text-secondary); font-size: 11.5px; pointer-events: none; z-index: 5; }

  /* —— 悬浮工具条（右上） —— */
  #toolbar { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; align-items: center;
             background: rgba(26,27,31,.92); border: 1px solid var(--border-subtle); padding: 5px 7px;
             border-radius: var(--r-ctl); z-index: 6; }
  #toolbar button, #toolbar select { height: 24px; padding: 0 8px; font-size: 11.5px;
             background: transparent; border-color: transparent; color: var(--text-secondary); }
  #toolbar button:hover { background: var(--bg-elevated); color: var(--text-primary); }
  #toolbar select { border-color: var(--border-strong); background: var(--bg-inset); }
  #toolbar label { display: flex; gap: 4px; align-items: center; color: var(--text-muted); font-size: 11px; }
  #toolbar .sep { width: 1px; height: 16px; background: var(--border-strong); margin: 0 2px; }
  #toolbar a { color: var(--text-secondary); font-size: 11.5px; padding: 0 6px; }
  #toolbar a:hover { color: var(--text-primary); text-decoration: none; }

  /* —— 底部时间轴 —— */
  #bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 30px; padding: 0 12px;
            background: rgba(26,27,31,.92); border-top: 1px solid var(--border-subtle);
            display: flex; gap: 12px; align-items: center; z-index: 6; }
  #bottom > span { color: var(--text-muted); font-size: 11px; white-space: nowrap; }
  #slider { flex: 1; }
  #bottom kbd { font-size: 10px; padding: 1px 4px; }

  /* —— 悬浮开关与弹出面板 —— */
  #metaToggle, #trimToggle { position: absolute; bottom: 40px; padding: 3px 9px;
             background: rgba(26,27,31,.88); border: 1px solid var(--border-subtle); color: var(--text-muted);
             border-radius: var(--r-ctl); font-size: 11px; cursor: pointer; z-index: 5; }
  #metaToggle { left: 10px; }
  #trimToggle { left: 78px; }
  #metaToggle:hover, #trimToggle:hover { color: var(--text-primary); }

  #metaBox { position: absolute; right: 10px; top: 52px; max-width: 340px; max-height: 60vh; overflow: auto;
             background: rgba(26,27,31,.96); border: 1px solid var(--border-strong); padding: 10px;
             border-radius: var(--r-ctl); font: 11px/1.6 var(--font-mono); white-space: pre;
             color: var(--text-secondary); display: none; z-index: 10; }
  #metaBox.open { display: block; }

  #trimBox { position: absolute; right: 10px; top: 84px; max-width: 340px;
             background: rgba(26,27,31,.96); border: 1px solid var(--border-strong); padding: 10px;
             border-radius: var(--r-ctl); font-size: 12px; display: none; z-index: 10; }
  #trimBox.open { display: block; }
  #trimBox b { font-size: 12px; }
  #trimInfo { color: var(--text-muted); font-size: 11px; }
  #trimCmd { width: 100%; height: 54px; margin-top: 6px; background: var(--bg-inset); color: var(--text-secondary);
             border: 1px solid var(--border-strong); border-radius: var(--r-ctl);
             font: 11px/1.4 var(--font-mono); resize: none; padding: 5px; }
  #trimBox .row button { height: 24px; padding: 0 8px; font-size: 11.5px; }

  #auxMenu, #refMenu { position: absolute; top: 52px; right: 10px; min-width: 190px;
             background: rgba(26,27,31,.96); border: 1px solid var(--border-strong); padding: 10px 12px;
             border-radius: var(--r-ctl); display: none; z-index: 11; font-size: 12px; }
  #auxMenu.open, #refMenu.open { display: block; }
  #auxMenu b, #refMenu b { font-size: 12px; }
  #auxMenu label, #refMenu label { display: flex; gap: 6px; padding: 3px 0; cursor: pointer; color: var(--text-secondary); }

  /* —— 会话抽屉（左滑出） —— */
  #panel { position: absolute; left: 0; top: 0; bottom: 0; width: 340px;
           background: var(--bg-sidebar); border-right: 1px solid var(--border-subtle);
           padding: 12px 14px; overflow-y: auto; display: none; z-index: 20;
           color: var(--text-primary); font: 13px/1.5 var(--font-ui); }
  #panel.open { display: block; }
  #panel > div:first-child { display: flex; justify-content: space-between; align-items: center; }
  #panel b { font-size: 13px; font-weight: 600; }
  #panelStatus { color: var(--text-muted); font-size: 11px; }
  #panelClose { background: transparent; border-color: transparent; color: var(--text-muted); width: 24px; height: 24px; padding: 0; }
  #boardBox { margin: 10px 0; padding: 9px 10px; background: var(--bg-panel);
              border: 1px solid var(--border-subtle); border-radius: var(--r-ctl); font-size: 12px; }
  #boardStatus { color: var(--text-secondary); margin-bottom: 6px; }
  #recBtn.recording { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  #recSid { color: var(--text-muted); font-size: 11px; margin-left: 8px; }
  #boardMeta { color: var(--text-muted); font-size: 11px; margin-top: 4px; }
  #sessTable { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
  #sessTable th { text-align: left; color: var(--text-muted); font-weight: 500; font-size: 11px;
                  padding: 3px 4px; border-bottom: 1px solid var(--border-strong); }
  #sessTable td { padding: 5px 4px; border-bottom: 1px solid var(--border-subtle); cursor: pointer;
                  font-variant-numeric: tabular-nums; }
  #sessTable tr.sel td { background: var(--accent-soft); }
  #sessTable tr:hover td { background: var(--bg-elevated); }
  #sessTable .dim { color: var(--text-muted); }
  #sessTable .ok { color: var(--success); }
  #sessEmpty { color: var(--text-muted); padding: 8px 0; display: none; }
  #syncNote { color: var(--warning); font-size: 11px; margin-top: 6px; }
  #recoverRow { display: none; margin-top: 6px; }
  #recoverRow.open { display: flex; }
  #recoverRow button { height: 26px; padding: 0 10px; font-size: 11.5px; }
  #renameRow { display: none; gap: 6px; margin-top: 8px; align-items: center; }
  #renameRow.open { display: flex; }
  #renameRow input { flex: 1; min-width: 0; height: 26px; padding: 0 8px; font-size: 12px; }
  #renameRow button { height: 26px; padding: 0 10px; font-size: 11.5px; }
  #panel .row button { height: 26px; padding: 0 10px; font-size: 11.5px; }
  #panel .row button#delBtn { margin-left: auto; }
</style>
</head>
<body>
<div id="view"></div>

<div id="hud">未载入</div>
<div id="flyHud">飞行模式 — WASD 移动 · 空格/Shift 升降 · 滚轮调速 · 鼠标视角 · R=复位 T=正视 · F/ESC 退出</div>
<div id="frameInfo"></div>
<div id="status">点「会话」载入 captures\remote\&lt;sid&gt;</div>

<div id="trimBox">
  <b>剪辑 (HR-03)</b>
  <span id="trimInfo">未选区间</span>
  <div class="row" style="gap:6px;margin-top:6px">
    <button id="trimStartBtn">标起点</button>
    <button id="trimEndBtn">标终点</button>
    <button id="trimClearBtn">清区间</button>
    <button id="trimCopyBtn" title="复制剪辑命令到剪贴板">复制 trim 命令</button>
  </div>
  <textarea id="trimCmd" readonly placeholder="选区间后点「复制 trim 命令」"></textarea>
</div>

<div id="toolbar">
  <button id="sessionsBtn">会话</button>
  <a href="validation.html">算法验证</a>
  <span class="sep"></span>
  <button id="pickBtn">手动选目录</button>
  <input id="dirInput" type="file" webkitdirectory style="display:none">
  <span class="sep"></span>
  <button id="playBtn" title="空格">▶</button>
  <select id="speedSel"></select>
  <label><input id="loopChk" type="checkbox" checked>循环</label>
  <span class="sep"></span>
  <button id="resetBtn" title="R 键：复位">复位</button>
  <button id="frontBtn" title="T 键：雷达正视图">正视</button>
  <button id="topBtn" title="7 键：顶视正交">顶视</button>
  <button id="sideBtn" title="3 键：侧视正交">侧视</button>
  <button id="perspBtn" title="0 键：复位透视">透视</button>
  <span class="sep"></span>
  <label>着色 <select id="lutSel">
    <option value="lut">亮→白</option>
    <option value="lut2">亮→黄</option>
    <option value="gray">灰度</option>
  </select></label>
  <button id="auxBtn" title="辅助显示开关">显示</button>
  <button id="refBtn" title="参照物">参照</button>
  <span class="sep"></span>
  <button id="detectBtn" title="HR-09 B1 实时人体锁定">人检:关</button>
</div>

<canvas id="detectTopView" width="180" height="180" style="position:absolute;bottom:60px;right:10px;background:rgba(0,0,0,0.3);border:1px solid var(--border-subtle);display:none;z-index:8"></canvas>
<div id="detectHud" style="position:absolute;bottom:248px;right:10px;color:#ff8080;font-size:11px;font-family:var(--font-mono);display:none;z-index:8;text-shadow:0 1px 2px #000"></div>

<div id="auxMenu">
  <div><b>辅助显示</b></div>
  <label><input id="auxGrid" type="checkbox" checked> 地面网格 1m</label>
  <label><input id="auxGridFine" type="checkbox"> 细格 0.1m</label>
  <label><input id="auxAxes" type="checkbox" checked> XYZ 三轴</label>
  <label><input id="auxOrigin" type="checkbox" checked> 雷达原点</label>
</div>
<div id="refMenu">
  <div><b>参照物</b></div>
  <label><input id="refPersonStand" type="checkbox"> 1.8m 站立人形（可拖）</label>
  <label><input id="refPersonLying" type="checkbox"> 1.8m 横放人形</label>
  <label><input id="refDoor21" type="checkbox"> 2.1m 门框</label>
  <label><input id="refDoor17" type="checkbox"> 1.7m 门框</label>
</div>
<div id="coordHud">(x,y): —</div>

<div id="metaBox"></div>
<button id="metaToggle" title="会话 meta">ⓘ meta</button>
<button id="trimToggle" title="剪辑 (HR-03)">✂ trim</button>

<div id="bottom">
  <span>时间轴</span>
  <input id="slider" type="range" min="0" max="0" value="0">
  <span><kbd>空格</kbd> 播/停 · <kbd>←</kbd><kbd>→</kbd> 帧 · <kbd>Shift</kbd> ×10 · <kbd>F</kbd> 飞行 · <kbd>R</kbd> 复位 · <kbd>T</kbd> 正视</span>
</div>

<div id="panel">
  <div>
    <b>会话</b>
    <span id="panelStatus"></span>
    <button id="panelClose">×</button>
  </div>

  <div id="boardBox">
    <div id="boardStatus">板端未连接</div>
    <button id="recBtn">● 开始录制</button>
    <span id="recSid"></span>
    <div id="boardMeta"></div>
  </div>

  <table id="sessTable">
    <thead><tr><th>会话</th><th>时长</th><th>帧</th><th>远端</th><th>本地</th></tr></thead>
    <tbody id="sessBody"></tbody>
  </table>
  <div id="sessEmpty">无会话</div>

  <div class="row" style="gap:8px;margin-top:10px">
    <button id="refreshBtn">刷新</button>
    <button id="syncBtn">同步选中</button>
    <button id="browseBtn">手动选…</button>
    <button id="renameBtn">改名</button>
    <button id="delBtn" class="danger">删除</button>
  </div>
  <div id="renameRow">
    <input id="renameInput" maxlength="60" placeholder="会话名称（留空=恢复默认）">
    <button id="renameOk">保存</button>
    <button id="renameCancel">取消</button>
  </div>
  <div id="syncNote"></div>
  <div id="recoverRow">
    <button id="recoverBtn" title="板端卡在传输中：退回就绪并重新拉取">退回重试</button>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/TrackballControls.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/TransformControls.js"></script>
<script src="human_replay_lib.js"></script>
<script src="detect_overlay.js"></script>
<script src="replay.js"></script>
<script src="panel.js"></script>
<script src="detect_ui.js"></script>
<script>
// 联合录制拉回完成 → 总控制台以 ?sid= 打开本页时自动载入该会话（其它入口无 ?sid 不受影响）。
// ponytail: 自定义保存目录不在本服务目录下时这里会载入失败，回放状态栏会显示原因。
(function () {
  var qsid = new URLSearchParams(location.search).get("sid");
  if (qsid && /^[A-Za-z0-9_-]{1,100}$/.test(qsid) && window.__load_session_sid) {
    window.__load_session_sid(qsid).catch(function () {});  // 失败态已由回放 status 显示
  }
})();
</script>
</body>
</html>
