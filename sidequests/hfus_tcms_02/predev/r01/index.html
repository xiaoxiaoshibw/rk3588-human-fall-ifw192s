<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TCMS-02 · 录制前契约回放</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#0c1420;color:#d9e5ee}body{margin:0}header{padding:16px 24px;background:#182637;border-bottom:1px solid #345}h1{font-size:20px;margin:0 0 8px}.warn{color:#ffd477}main{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:16px}aside,section{background:#121e2c;border:1px solid #2a3c4d;border-radius:8px;padding:12px}button,select,input{font:inherit;padding:6px;background:#23374c;color:#e6f2ff;border:1px solid #47617a;border-radius:4px}button,a{cursor:pointer}a{color:#91cfff}label{display:block;margin:9px 0}canvas{width:100%;height:530px;background:#0b121c;touch-action:none}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:360px;overflow:auto}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.cases a{display:block;margin:8px 0}.swatch{display:inline-block;width:10px;height:10px;margin-right:8px}#time{flex:1}#status{min-height:45px}#kind{font-weight:bold}summary{cursor:pointer}@media(max-width:900px){main{grid-template-columns:1fr}canvas{height:380px}}
</style>
<header><h1>地面与静态表面联合提取 · V0–V2</h1><div id="kind" class="warn">SYNTHETIC · contract-only</div><div>软件契约演示；真实 A–D / 地面身份 / 人体效果 BLOCKED。人工确认夹具由模拟器提供，未自动识别人。</div></header>
<main><aside><label>输入 <select id="session" aria-label="输入"></select></label><label>单因素消融 <select id="variant" aria-label="单因素消融"></select></label><div id="layers"></div><div class="toolbar"><button id="orbit">斜视</button><button id="top">顶视</button><button id="front">正视</button></div><p>拖动旋转，滚轮缩放；点击当前点或地图点查询。地图方块、预测虚线均不计当前成员。</p><div class="cases" id="cases"></div><details><summary>能力与账本</summary><pre id="details"></pre></details></aside>
<section><div class="toolbar"><button id="prev">上一帧</button><button id="play">播放</button><button id="next">下一帧</button><input id="time" type="range" min="0" aria-label="帧时间轴"><input id="jump" type="number" min="0" value="0" aria-label="跳转帧"><button id="go">跳转</button></div><div id="status"></div><canvas id="cloud" aria-label="分层点云回放"></canvas><div class="toolbar"><label>帧内 source_row <input id="row" type="number" min="0" value="0"></label><button id="query">查当前源行 XYZ</button><label>surface_id <input id="surface" type="number" min="0" value="0"></label><button id="queryMap">查地图来源</button></div><pre id="source">点击点或输入源行查询。</pre></section></main><script src="/app.js"></script></html>
