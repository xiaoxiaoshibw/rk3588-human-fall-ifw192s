<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCMS 真实开发诊断回放</title>
<style>:root{color-scheme:dark;font:14px system-ui;background:#101723;color:#dce7f3}body{margin:0}header{padding:16px 24px;background:#1a293b}h1{font-size:21px;margin:0 0 8px}.warn{color:#ffd27c}main{display:grid;grid-template-columns:310px 1fr;gap:14px;padding:14px}aside,section{padding:12px;background:#162131;border:1px solid #34465a;border-radius:8px}button,input,select{font:inherit;color:inherit;background:#23374d;border:1px solid #526c87;padding:6px;border-radius:4px}button,a{cursor:pointer}label{display:block;margin:7px 0}.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}a{color:#9bd4ff}#cases a,#candidates button{display:block;margin:7px 0}#candidates{max-height:240px;overflow:auto}canvas{width:100%;height:570px;background:#080e17;touch-action:none}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:330px;overflow:auto;font-size:12px}#time{flex:1}#status{padding:10px 0;min-height:45px}input[type=number]{width:80px}@media(max-width:950px){main{grid-template-columns:1fr}canvas{height:400px}}</style>
<header><h1>真实开发录制 · 源行可查诊断回放</h1><div class="warn">REAL_DEVELOPMENT / B · development_seen / dev-tainted · 全部780帧 · 无人体GT，效果 BLOCKED</div><div>布局已由用户确认；M0资格按帧显示，地面仍是历史未资格候选。AI视觉审核与人工GT分开；原始坐标不表示物理高度。</div></header>
<main><aside><label>会话 <select id="session"></select></label><label>方案 <select id="variant"></select></label><div id="layers"></div><div class="bar"><button id="orbit">斜视</button><button id="top">RAW XY</button><button id="front">RAW XZ</button><button id="focus">聚焦候选</button></div><p>拖动旋转，滚轮缩放；点选当前点或地图方块查来源。</p><div id="cases"></div><h3>本帧未知候选</h3><div id="candidates"></div><details><summary>完整账与资格</summary><pre id="details"></pre></details></aside>
<section><div class="bar"><button id="prev">上一帧</button><button id="play">播放</button><button id="next">下一帧</button><input id="time" type="range" min="0" max="779" aria-label="帧"><input id="jump" type="number" min="0" max="779" aria-label="跳帧"><button id="go">跳帧</button><input id="seconds" type="number" step="0.1" min="0" aria-label="相对秒"><button id="goSeconds">跳秒</button></div><div id="status"></div><canvas id="cloud" aria-label="原始坐标分层点云"></canvas><div class="bar"><label>source_row <input id="row" type="number" min="0" value="0"></label><button id="query">查原28B源行</button><label>surface_id <input id="surface" type="number" min="0" value="0"></label><button id="queryMap">查表面全部来源索引</button></div><pre id="source">可查询未渲染的任意原始行；显示抽样不影响算法或完整账。</pre></section></main><script src="/app.js"></script></html>
