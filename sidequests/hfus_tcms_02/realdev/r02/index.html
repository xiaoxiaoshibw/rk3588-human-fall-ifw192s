<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S01 候选配平坐标诊断</title><style>
*{box-sizing:border-box}body{margin:0;background:#101824;color:#dde6ef;font:14px system-ui,sans-serif}header{padding:15px 22px;background:#172435;border-bottom:1px solid #42516a}h1{font-size:21px;margin:0 0 6px}.warn{color:#ffd18a}button,input,select{background:#263a50;color:#eef5fb;border:1px solid #61768d;padding:6px;border-radius:5px}button{cursor:pointer}label{display:inline-block;margin:5px 9px 5px 0}.toolbar{padding:10px 22px}input[type=number]{width:85px}.views{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#536174}.pane{background:#0c1521;padding:8px}.pane h2{font-size:15px;margin:2px 8px 6px}canvas{display:block;width:100%;height:470px;cursor:crosshair}#status,#summary,#versions{margin:8px 22px;white-space:pre-wrap;font:12px ui-monospace,monospace;overflow-wrap:anywhere}#status{color:#9ee7d8}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:12px 22px}pre{margin:5px 0;background:#172435;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:390px;overflow:auto;font-size:12px}details{margin:8px 22px}.legend{margin:8px 22px;color:#b6c9dc}.small{font-size:12px;color:#a8b9ca}@media(max-width:900px){.views,.bottom{grid-template-columns:1fr}canvas{height:340px}}
</style><header><h1>RAW ↔ 候选配平 · 完整对象坐标诊断</h1><div class="warn">候选配平预览，地面身份与本段几何尚未验证</div><div>CANDIDATE_PLANE_PREVIEW / OFFLINE_REVIEW · development_seen / dev-tainted</div></header>
<div class="toolbar"><label>帧号 <input id="fi" type="number" min="0" max="779" value="430"></label><button id="load">加载帧</button> <button id="prev">上一帧</button> <button id="next">下一帧</button><label>检查案例 <select id="cases"></select></label><label>相机 <select id="camera"><option value="oblique">斜视</option><option value="side">XZ侧视</option><option value="front">YZ正视</option><option value="top">XY俯视</option></select></label><label>缩放 <input id="zoom" type="range" min="20" max="150" value="75"></label><br>
<label><input id="current" type="checkbox" checked>当前点</label><label><input id="map" type="checkbox" checked>冻结M0表面</label><label><input id="support" type="checkbox">M0支持点</label><label><input id="boxes" type="checkbox" checked>候选框/中心</label><label><input id="tracks" type="checkbox" checked>历史轨迹/预测</label><span class="small">鼠标点选任一面板中的当前点；相机只改变投影。</span></div>
<div id="status" role="status">加载中</div><div class="views"><section class="pane"><h2 id="rawTitle">RAW</h2><canvas id="raw" aria-label="RAW点云，点击反查源行"></canvas></section><section class="pane"><h2 id="localTitle">候选配平</h2><canvas id="local" aria-label="候选配平点云，点击反查源行"></canvas></section></div>
<div class="legend">灰：当前场景　青：冻结M0　紫：M0支持点　橙：候选/历史平面　绿：冻结轨迹　粉：预测　网格：z=0（米）</div><div id="summary"></div>
<div class="bottom"><section><label>source_row <input id="row" type="number" min="0" value="0"></label> <button id="query">反查源点</button><pre id="point">点选后显示原始28B、RAW XYZ、候选XYZ、源SHA及坐标版本。</pre></section><section><label>surface_id <input id="surface" type="number" min="0" value="0"></label> <button id="querySurface">反查M0支持</button><pre id="surfaceInfo">地图按原可用时间显示；支持点分页反查到原始源行。</pre></section></div>
<details open><summary>R/t、法向、资格与数值检查</summary><pre id="versions"></pre></details><details><summary>浏览器诊断记录</summary><pre id="diagnostics"></pre></details><script src="/app.js"></script></html>
