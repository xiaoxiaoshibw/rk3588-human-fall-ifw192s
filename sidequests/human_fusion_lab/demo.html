<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUMAN-FUSION 研究回放</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1017;color:#dce8f5;font:14px system-ui}header{padding:18px 24px;border-bottom:1px solid #293444;display:flex;gap:20px;align-items:center}h1{font-size:20px;margin:0}small{color:#99adc3}select,button{background:#1b2939;color:#dce8f5;border:1px solid #3c5068;padding:8px;border-radius:5px}button{cursor:pointer}main{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:14px;padding:16px}canvas{background:#101a26;width:100%;height:65vh;touch-action:none;border:1px solid #293444;border-radius:8px}aside{max-height:78vh;overflow:auto}table{width:100%;font-size:12px;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #293444;text-align:left}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 0}input[type=range]{flex:1;min-width:100px}label{font-size:12px}#status{padding:10px;background:#182739;border-radius:5px;white-space:pre-wrap}#detail{white-space:pre-wrap;font-size:12px}.legend{padding:8px;color:#9eb4cc}@media(max-width:900px){main{grid-template-columns:1fr}aside{max-height:none}}
</style><header><h1>HUMAN-FUSION</h1><small>Demo V1 · 本地隔离研究 · CPU 回放</small></header><main><section><div class="controls"><select id="session" aria-label="会话"></select><select id="model" aria-label="算法"></select><button id="play">播放</button><button id="reset">重置 / 重播</button></div><canvas id="view" aria-label="三维点云、候选与 GT"></canvas><div class="controls"><span id="counter"></span><input id="seek" type="range" min="0" max="0" value="0" aria-label="回放帧"><label>倍速<select id="speed"><option>1</option><option>2</option><option>4</option></select></label><button id="top">俯视</button><button id="side">侧视</button></div><div class="controls"><label><input id="raw" type="checkbox" checked>原始点云</label><label><input id="cand" type="checkbox" checked>候选点集</label><label><input id="gt" type="checkbox" checked>可信 GT</label><label><input id="track" type="checkbox" checked>轨迹</label></div><div class="legend">灰：场景点 · 绿：强人体分类 · 黄：弱候选 · 红：拒绝 · 青：GT · 紫：确认轨迹<br>拖动旋转，滚轮缩放；点击候选行检查完整点集和 GT 差异。</div><div id="status">读取会话…</div></section><aside><h3>候选 / Track ID</h3><table><thead><tr><th>候选</th><th>分数 / 点数</th><th>轨迹</th></tr></thead><tbody id="rows"></tbody></table><p id="detail"></p><p><small>GT 资格来自当前文件绑定与审阅标记；未标或绑定不符为 UNKNOWN。回顾性测试不证明陌生人员或新场景泛化。</small></p></aside></main><script>
const $=id=>document.getElementById(id),cv=$('view'),ctx=cv.getContext('2d');let frame=null,cloud=null,index=0,playing=false,busy=false,epoch=0,selected=null,angle=.3,tilt=.65,scale=60,history=new Map();let pendingFallbackNote='';
async function json(url){const r=await fetch(url);const v=await r.json();if(!r.ok)throw Error(v.error||r.status);return v;}
function project(x,y,z){const a=x*Math.cos(angle)-y*Math.sin(angle),b=x*Math.sin(angle)+y*Math.cos(angle);return [cv.width*.5+a*scale,cv.height*.78-(b*Math.cos(tilt)+z*Math.sin(tilt))*scale];}
function dot(x,y,z,color,size=2){const p=project(x,y,z);ctx.fillStyle=color;ctx.fillRect(p[0],p[1],size,size);}
function text(x,y,z,label,color){const p=project(x,y,z);ctx.fillStyle=color;ctx.font='12px system-ui';ctx.fillText(label,p[0]+5,p[1]-5);}
function draw(){cv.width=cv.clientWidth*devicePixelRatio;cv.height=cv.clientHeight*devicePixelRatio;ctx.clearRect(0,0,cv.width,cv.height);if(!cloud||!frame)return;ctx.strokeStyle='#22364a';for(let a=-8;a<=8;a++){for(const pts of [[a,-8,0,a,8,0],[-8,a,0,8,a,0]]){const p=project(...pts.slice(0,3)),q=project(...pts.slice(3));ctx.beginPath();ctx.moveTo(...p);ctx.lineTo(...q);ctx.stroke();}}
 if($('raw').checked)for(let i=0;i<cloud.length;i+=4){if([cloud[i],cloud[i+1],cloud[i+2]].every(Number.isFinite)&&Math.abs(cloud[i])<20&&Math.abs(cloud[i+1])<20)dot(cloud[i],cloud[i+1],cloud[i+2],'#547087',1);}
 if($('cand').checked)for(const c of frame.candidates){const color=c.decision==='CONFIRMED_HUMAN'?'#4fe49e':c.decision==='HUMAN_CANDIDATE'?'#ffd366':'#f27d87';for(const id of c.indices)dot(cloud[id*4],cloud[id*4+1],cloud[id*4+2],color,selected===c.id?4:2);text(c.x,c.y,c.z,c.id,color);}
 if($('gt').checked)for(const g of frame.gt){text(g.x,g.y,2.2,'GT '+g.class_name+' '+(g.track_id||g.id),'#6ce2f0');const p=project(g.x,g.y,0);ctx.strokeStyle='#6ce2f0';ctx.beginPath();ctx.arc(p[0],p[1],(g.radius||.4)*scale,0,Math.PI*2);ctx.stroke();}
 if($('track').checked)for(const t of frame.tracks){if(!t.human_confirmed||t.lost)continue;const id=t.track_id_fusion||t.id;text(t.x,t.y,t.z,id,'#e2a6ff');const pts=history.get(id)||[];ctx.strokeStyle='#e2a6ff';ctx.beginPath();pts.forEach((v,j)=>{const p=project(...v);if(j)ctx.lineTo(...p);else ctx.moveTo(...p);});ctx.stroke();}}
function inspect(c){selected=c.id;const near=frame.gt.filter(g=>g.class_name==='PERSON').map(g=>({GT:g.track_id,distance_m:Math.hypot(c.x-g.x,c.y-g.y).toFixed(3)}));$('detail').textContent=JSON.stringify({candidate:c.id,decision:c.decision,score:c.prob,point_count:c.n,source:c.source,track_id:c.track_id,track_confirmed:c.track_confirmed,GT_status:frame.gt_status,GT_distance:near,point_indices_preview:c.indices.slice(0,32)},null,2);draw();}
async function update(){if(busy)return;busy=true;const token=epoch,requested=index;const q=new URLSearchParams({sid:$('session').value,model:$('model').value,index:String(index)});$('status').textContent='正在回放至第 '+index+' 帧…';try{const v=await json('/api/frame?'+q),r=await fetch('/api/cloud?'+q);if(!r.ok)throw Error('点云加载失败');const b=await r.arrayBuffer();if(token!==epoch)return;frame=v;cloud=new Float32Array(b);$('seek').max=v.total-1;$('seek').value=requested;$('counter').textContent=requested+' / '+(v.total-1);$('status').textContent='算法：'+v.detector+(v.fallback?' · 回退原因：'+v.fallback:'')+'\nGT：'+v.gt_status+' · 检测耗时 '+v.ms.toFixed(2)+' ms · 代际 '+v.generation+(v.gt_diff?'\n候选 GT 对照：TP '+v.gt_diff.candidates.tp+' / FP '+v.gt_diff.candidates.fp+' / FN '+v.gt_diff.candidates.fn+'（0.75 m 一对一门）':'\nGT 对照：UNKNOWN')+(pendingFallbackNote?'\n⚠ '+pendingFallbackNote:'');if(pendingFallbackNote){pendingFallbackNote='';}
 $('rows').replaceChildren();for(const c of v.candidates){const tr=document.createElement('tr');for(const val of [c.id,c.prob.toFixed(3)+' / '+c.n,c.track_id+(c.track_confirmed?' ✓':'')]){const td=document.createElement('td');td.textContent=val;tr.append(td);}tr.onclick=()=>inspect(c);$('rows').append(tr);}
 for(const t of v.tracks){if(t.lost||!t.human_confirmed)continue;const id=t.track_id_fusion||t.id,arr=history.get(id)||[];arr.push([t.x,t.y,t.z]);if(arr.length>100)arr.shift();history.set(id,arr);}draw();
 }catch(e){$('status').textContent='错误：'+e.message;playing=false;}finally{busy=false;if(token!==epoch){update();return;}if(playing&&index<Number($('seek').max)){index++;setTimeout(update,100/Number($('speed').value));}else if(playing){playing=false;$('play').textContent='播放';}}}
async function change(){epoch++;playing=false;index=0;history.clear();selected=null;$('detail').textContent='';$('play').textContent='播放';if(!busy)update();}
$('session').onchange=change;$('model').onchange=change;$('reset').onclick=change;$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'暂停':'播放';if(playing&&!busy){if(frame&&index>=frame.total-1){index=0;history.clear();}update();}};$('seek').onchange=()=>{epoch++;playing=false;index=Number($('seek').value);history.clear();$('play').textContent='播放';if(!busy)update();};['raw','cand','gt','track'].forEach(id=>$(id).onchange=draw);$('top').onclick=()=>{angle=0;tilt=0;draw();};$('side').onclick=()=>{angle=0;tilt=Math.PI/2;draw();};let drag=null;cv.onpointerdown=e=>{drag=[e.clientX,e.clientY];cv.setPointerCapture(e.pointerId);};cv.onpointermove=e=>{if(!drag)return;angle+=(e.clientX-drag[0])*.01;tilt=Math.max(0,Math.min(Math.PI/2,tilt+(e.clientY-drag[1])*.01));drag=[e.clientX,e.clientY];draw();};cv.onpointerup=()=>drag=null;cv.onwheel=e=>{e.preventDefault();scale=Math.max(15,Math.min(300,scale*Math.exp(-e.deltaY*.001)));draw();};window.onresize=draw;
json('/api/sessions').then(v=>{for(const s of v.sessions){const o=document.createElement('option');o.value=s.sid;o.textContent=s.activity+' · GT '+s.gt+(s.sha_ok?'':' · ⚠SHA');$('session').append(o);}for(const m of v.detectors){const o=document.createElement('option');o.value=m;o.textContent=m;$('model').append(o);}
 /* 深链（STEP 1）：?sid= 合法且存在→尊重；非法/不存在→回退 default_session 并显式提示。 */
 const q=new URLSearchParams(location.search),qsid=q.get('sid'),qmodel=q.get('model');
 const sids=v.sessions.map(s=>s.sid);let picked=v.default_session||(sids[sids.length-1]||'');
 if(qsid){if(sids.includes(qsid))picked=qsid;else pendingFallbackNote='指定 sid 不可用，已回退到最新有效会话：'+picked;}
 if(picked)$('session').value=picked;$('model').value=(qmodel&&v.detectors.includes(qmodel))?qmodel:(v.default||'rf51_baseline');update();}).catch(e=>$('status').textContent=e.message);
</script></html>
