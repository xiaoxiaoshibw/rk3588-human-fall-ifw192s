<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>HFUS 逐源标注与离线对照</title>
<style>body{font:14px system-ui;background:#101923;color:#d7e3ee;margin:20px}button,input,select{padding:7px;margin:3px;background:#213447;color:inherit;border:1px solid #50687e}a{color:#8dd8ef}canvas{background:#07111c;border:1px solid #344c63;width:49%;height:420px}pre{white-space:pre-wrap;max-height:260px;overflow:auto}.bar{padding:12px;border:1px solid #344c63}label{display:inline-block}#status{color:#f9cf80}h1{font-size:22px}</style>
<h1>源行标注与冻结几何对照 · E0</h1><p>语义、实例、关节未知。几何选中仅为建议；学习权重未训练。<a href="/">返回原 R1 页面</a></p>
<div class="bar"><select id="task"></select><button id="prev">上一项</button><button id="next">下一项</button><select id="sid"></select><input id="fi" type="number" min="0" value="0"><select id="group"></select><select id="coord"><option>raw</option><option>nominal</option><option selected>corrected</option></select><select id="height"><option value="128">128×512</option><option value="256">256×1024</option></select><select id="depth"><option value="range">径向 r</option><option value="axial">+X 轴深度</option></select><select id="layer"><option value="0">最近层</option><option value="1">第二层</option></select><button id="load">读取冻结帧</button></div>
<p id="status">读取中</p><p>左图：源点三维投影，拖动旋转，滚轮缩放，Ctrl拖动平移；点击查询源行。按住 Shift 拖矩形批选。右图：距离图点击像素关联完整 CSR（含溢出）。绿=几何选中，黄/红=较G0新增/移除，蓝=已审人体，灰蓝=未审/UNKNOWN，橙=人工非人体，粉=当前选择。</p>
<canvas id="cloud" width="1000" height="600"></canvas><canvas id="scan" width="1024" height="512"></canvas>
<div class="bar"><span id="selection">0 点</span><button id="clear">清除选择</button><button id="undo">撤销本地修改</button><select id="class"><option>UNKNOWN</option><option>TRUSTED_HUMAN</option><option>VERIFIED_NONHUMAN</option></select><input id="instance" placeholder="可证实实例ID；可留空"><button id="assign">标记所选</button><button id="proposal">选择几何建议（不是GT）</button><br>
<input id="reviewer" placeholder="真实人工审核者"><select id="reviewLayer"><option>PRIMARY</option><option>SECONDARY</option></select><select id="visibility"><option>UNKNOWN</option><option>PARTIAL</option><option>VISIBLE</option></select><input id="reason" placeholder="修订原因"><br>
<label><input id="full" type="checkbox">已审完整视图</label><label><input id="coverage" type="checkbox">可见人体覆盖已核</label><label><input id="exhaustive" type="checkbox">实例穷尽已核</label><button id="save">保存人工修订</button></div>
<pre id="source"></pre><details><summary>版本、缺测与人工审计</summary><pre id="audit"></pre></details>
<script src="app.js"></script></html>
