<!doctype html><html lang="zh"><meta charset="utf-8"><title>HFUS D02 逐点待审</title>
<style>body{font:15px sans-serif;background:#121923;color:#eee;margin:16px}button,input,select{margin:5px;padding:7px}canvas{background:#060c14;border:1px solid #667;display:block}pre{white-space:pre-wrap;max-height:250px;overflow:auto}.warn{color:#ffc86a}</style>
<h2>HFUS D02 · 真实点集待审包</h2><p class="warn">所有建议和本页导出均为 DRAFT_UNREVIEWED / UNKNOWN。原始 GT 保持只读。S9 身份及负例资格需要独立人工审核；本页不能签发 reviewed。</p>
<p>选择生成包目录（不选 captures）：<input type="file" id="folder" webkitdirectory multiple></p>
<label>帧<select id="frames"></select></label><button id="prev">上一帧</button><button id="next">下一帧</button>
<label>视图<select id="view"><option value="0,1">俯视 XY</option><option value="0,2">侧视 XZ</option><option value="1,2">正视 YZ</option></select></label>
<label>建议对象<select id="objects"><option value="">全部原始建议</option></select></label>
<p>拖动矩形选点；切换视图继续筛选。<button id="clear">清空选择</button><button id="intersect">下次框选取交集</button>标签建议<select id="label"><option>UNKNOWN</option><option>PERSON</option><option>FURNITURE</option><option>BACKGROUND</option></select>身份草稿<input id="identity" placeholder="UNKNOWN"><button id="save">下载当前点集草稿</button></p>
<canvas id="canvas" width="1100" height="650"></canvas><pre id="info">等待选择包目录。逐点 raw/compact 索引通过两份映射交叉校验。</pre>
<script>
'use strict';
const $=id=>document.getElementById(id),ctx=$('canvas').getContext('2d');let files=new Map(),pkg,manifest,record,xyz,cmap,rmap,selected=new Set(),drag=null,project,intersection=false;
const bytes=async name=>{if(!files.has(name))throw Error('缺文件 '+name);return files.get(name).arrayBuffer();};
const sha=async buffer=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',buffer)),v=>v.toString(16).padStart(2,'0')).join('');
async function checked(name){const b=await bytes(name);if(await sha(b)!==manifest.files[name])throw Error('SHA不匹配 '+name);return b;}
function note(s){$('info').textContent=s;}
function draw(){if(!xyz)return;const axes=$('view').value.split(',').map(Number),w=1100,h=650;let lo=[Infinity,Infinity],hi=[-Infinity,-Infinity];for(let i=0;i<xyz.length;i+=4)for(let d=0;d<2;d++){lo[d]=Math.min(lo[d],xyz[i+axes[d]]);hi[d]=Math.max(hi[d],xyz[i+axes[d]]);}const scale=Math.min((w-30)/(hi[0]-lo[0]||1),(h-30)/(hi[1]-lo[1]||1)),mid=lo.map((v,i)=>(v+hi[i])/2);project=i=>[w/2+(xyz[i*4+axes[0]]-mid[0])*scale,h/2-(xyz[i*4+axes[1]]-mid[1])*scale];ctx.clearRect(0,0,w,h);const obj=$('objects').value,highlight=new Set();for(const s of record.suggestions)if(!obj||obj===s.object_id)for(const c of s.compact_indices)highlight.add(c);
for(let i=0;i<cmap.length;i++){const p=project(i);ctx.fillStyle=selected.has(i)?'#ffdc69':highlight.has(i)?'#ff829b':'#65a8c5';ctx.fillRect(p[0],p[1],selected.has(i)?3:1.5,selected.has(i)?3:1.5);}ctx.fillStyle='#eee';ctx.fillText('compact '+cmap.length+' / selected '+selected.size+'; '+$('view').selectedOptions[0].text+' · 米',10,20);
note(JSON.stringify({session:record.session_id,frame:record.frame,timestamp_s:record.timestamp_s,raw_sha:record.raw_frame_sha256,input_binding:record.original_gt_binding,qualification:record.qualification,exhaustive:record.exhaustive,selected:selected.size,suggestions:record.suggestions.map(s=>({id:s.object_id,source:s.label_source,original_status:s.original_review_status,qualification:s.qualification,points:s.raw_indices.length,track_id:s.track_id,index_error:s.index_error}))},null,2));}
async function load(){record=pkg.records[Number($('frames').value)];if(!record)return;xyz=new Float32Array(await checked(record.xyzi));cmap=new Uint32Array(await checked(record.compact_to_raw));rmap=new Int32Array(await checked(record.raw_to_compact));if(xyz.length!==cmap.length*4)throw Error('点数/映射不符');for(let i=0;i<cmap.length;i++)if(rmap[cmap[i]]!==i)throw Error('raw/compact映射不符');selected.clear();$('objects').replaceChildren(new Option('全部原始建议',''));for(const o of record.suggestions)$('objects').add(new Option(o.object_id+' / '+o.qualification,o.object_id));draw();}
function guarded(fn){return async(...args)=>{try{await fn(...args);}catch(e){xyz=null;ctx.clearRect(0,0,1100,650);note('BLOCKED: '+e.message);}};}
$('folder').onchange=guarded(async()=>{files.clear();for(const f of $('folder').files){const p=f.webkitRelativePath.split('/').slice(1).join('/');files.set(p,f);}manifest=JSON.parse(new TextDecoder().decode(await bytes('MANIFEST.json')));pkg=JSON.parse(new TextDecoder().decode(await checked('review_package.json')));$('frames').replaceChildren();pkg.records.forEach((r,i)=>$('frames').add(new Option(r.name+' f'+r.frame+' '+r.original_gt_binding,i)));await load();});
$('frames').onchange=guarded(load);$('view').onchange=draw;$('objects').onchange=draw;$('clear').onclick=()=>{selected.clear();draw();};$('intersect').onclick=()=>{intersection=true;note('下次框选与已有选择取交集（原始建议不会自动变为标签）。');};
for(const [id,step]of [['prev',-1],['next',1]])$(id).onclick=guarded(async()=>{$('frames').selectedIndex=Math.max(0,Math.min(pkg.records.length-1,$('frames').selectedIndex+step));await load();});
const pos=e=>{const b=$('canvas').getBoundingClientRect();return [(e.clientX-b.left)*1100/b.width,(e.clientY-b.top)*650/b.height];};
$('canvas').onmousedown=e=>{if(xyz)drag=pos(e);};$('canvas').onmouseup=e=>{if(!drag||!xyz)return;const end=pos(e),a=drag;drag=null;const box=new Set();for(let i=0;i<cmap.length;i++){const p=project(i);if(p[0]>=Math.min(a[0],end[0])&&p[0]<=Math.max(a[0],end[0])&&p[1]>=Math.min(a[1],end[1])&&p[1]<=Math.max(a[1],end[1]))box.add(i);}selected=intersection?new Set([...selected].filter(i=>box.has(i))):box;intersection=false;draw();};
$('save').onclick=guarded(async()=>{if(!record||!selected.size)throw Error('请选择非空真实点集');const compact=[...selected].sort((a,b)=>a-b),raw=compact.map(i=>cmap[i]),b=new ArrayBuffer(raw.length*4),v=new DataView(b);raw.forEach((r,i)=>v.setUint32(i*4,r,true));const out={schema_version:'hfus-manual-input-draft-v1',index_version:record.index_version,schema_contract:record.schema_contract,session_id:record.session_id,frame:record.frame,timestamp_s:record.timestamp_s,inputs:record.inputs,raw_frame_sha256:record.raw_frame_sha256,raw_indices:raw,compact_indices:compact,pointset_sha256:await sha(b),label_suggestion:$('label').value,identity_suggestion:$('identity').value||'UNKNOWN',label_source:'MANUAL_INPUT_UNREVIEWED',review_status:'DRAFT_UNREVIEWED',qualification:'UNKNOWN',independent_review:false,model_training_eligible:false,exhaustive:false};const url=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=record.session_id+'_f'+record.frame+'_DRAFT.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
</script></html>
