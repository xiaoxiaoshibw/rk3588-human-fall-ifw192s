# human_capture 节点级运行配置
port: 8766
bind: 0.0.0.0
staging_dir: /mnt/captures/captures_remote
sessions_db: /mnt/captures/captures_remote/sessions.json

# FIFO（HC-02）
fifo_keep: 10
fifo_interval_sec: 30
disk_floor_mb: 5120

# 网页直下（8766 /files/*）：限速 Kbit/s，同 scp -l 口径；0 = 不限速
# 2026-10-14 实测（PC→板 1G 直连，374MB）：70000=8.75MB/s / 800000=99.6MB/s /
# 0=118MB/s。取 800000 给同时在跑的实时流留 ~200Mbit（桥 93 + 预览 17）。
download_limit_kbit: 800000

# 录制（HC-02；调现成 record_session.py，D10）
# 注意：这是“模板/本地开发”值。正式现场由 deploy_human_fall.sh 用
# release_config.py capture 生成 effective_capture.yaml，把 record_script 改写为
# 当前 release 内的绝对路径（不可变、随 rollback 一起切换），不再读可变工作树。
record_script: /root/catkin_ws/src/human_fall_detection/scripts/record_session.py
record_config:                      # 可选；默认走 record_session 自带 DEFAULT_TOPICS
max_duration_sec: 300
sigint_grace_sec: 15
sigterm_kill_sec: 5

# 话题（仅供参考，实际由 record_session 自己 DEFAULT_TOPICS 决定）
record_topics: ["/innolidar_points", "/inno_imu", "/device_status"]
